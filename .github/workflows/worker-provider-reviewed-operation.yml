          SUBS_BOT_PROVIDER_MUTATION_TRUSTED_RESPONSE_SHA256: ${{ needs.dispatch.outputs.response_sha256 }}
          SUBS_BOT_PROVIDER_MUTATION_OBSERVATION_ARTIFACT_ID: ${{ needs.dispatch.outputs.observation_artifact_id }}
          SUBS_BOT_PROVIDER_MUTATION_OBSERVATION_ARTIFACT_SHA256: ${{ needs.dispatch.outputs.observation_artifact_sha256 }}
          SUBS_BOT_PROVIDER_MUTATION_OBSERVATION_SHA256: ${{ needs.dispatch.outputs.observation_sha256 }}
          SUBS_BOT_PROVIDER_MUTATION_TRUSTED_OBSERVATION_ARTIFACT_ID: ${{ needs.dispatch.outputs.observation_artifact_id }}
          SUBS_BOT_PROVIDER_MUTATION_TRUSTED_OBSERVATION_ARTIFACT_SHA256: ${{ needs.dispatch.outputs.observation_artifact_sha256 }}
          SUBS_BOT_PROVIDER_MUTATION_TRUSTED_OBSERVATION_SHA256: ${{ needs.dispatch.outputs.observation_sha256 }}
          SUBS_BOT_PROVIDER_MUTATION_INTENT_SHA256: ${{ needs.intent_readback.outputs.intent_sha256 }}
          SUBS_BOT_PROVIDER_MUTATION_VERIFICATION_JSON: ${{ needs.verify.outputs.verification_json }}
          SUBS_BOT_PROVIDER_NEXT_AGE_ARTIFACT_ID: ${{ needs.verify.outputs.next_age_id }}
          SUBS_BOT_PROVIDER_NEXT_AGE_ARTIFACT_SHA256: ${{ needs.verify.outputs.next_age_zip_sha256 }}
          SUBS_BOT_PROVIDER_NEXT_ARCHIVE_ARTIFACT_ID: ${{ needs.verify.outputs.next_archive_id }}
          SUBS_BOT_PROVIDER_NEXT_ARCHIVE_ARTIFACT_SHA256: ${{ needs.verify.outputs.next_archive_zip_sha256 }}
          SUBS_BOT_PROVIDER_NEXT_LIVE_ARTIFACT_ID: ${{ needs.verify.outputs.next_live_id }}
          SUBS_BOT_PROVIDER_NEXT_LIVE_ARTIFACT_SHA256: ${{ needs.verify.outputs.next_live_zip_sha256 }}
          SUBS_BOT_PROVIDER_NEXT_TARGET_KEYS_JSON: ${{ secrets.SUBS_BOT_PROVIDER_NEXT_TARGET_KEYS_JSON }}
