          SUBS_BOT_PROVIDER_MUTATION_RESPONSE_SHA256: ${{ needs.dispatch.outputs.response_sha256 }}
          SUBS_BOT_PROVIDER_MUTATION_TRUSTED_ARTIFACT_ID: ${{ needs.dispatch.outputs.artifact_id }}
