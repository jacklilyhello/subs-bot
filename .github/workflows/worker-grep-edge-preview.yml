name: Probe Grep from a temporary Cloudflare Worker
run-name: Grep edge preview for ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "probe Grep in the isolated Cloudflare preview"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: subs-bot-isolation-deploy
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' &&
      github.run_attempt == '1' && inputs.confirmation == 'probe Grep in the isolated Cloudflare preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-sha256: ${{ steps.upload.outputs.artifact-digest }}
      module-sha256: ${{ steps.build.outputs.module-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build the fixed public fixture with locked dependencies
        id: build
        working-directory: worker
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fxq 'const compatibilityDate = "2026-07-30";' tools/isolation-fixture.mjs
          npm ci --ignore-scripts
          umask 077
          module="$RUNNER_TEMP/subs-bot-grep-edge/probe.mjs"
          node_modules/.bin/esbuild tools/grep-edge-preview.ts --bundle --format=esm --platform=browser \
            --target=es2022 --define:PROBE_REVISION="\"$GITHUB_SHA\"" --outfile="$module"
          digest="$(sha256sum "$module" | cut -d ' ' -f 1)"
          printf 'module-sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: subs-bot-grep-edge-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-grep-edge/probe.mjs
          if-no-files-found: error
          retention-days: 1

  edge:
    needs: build
    if: >-
      github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' &&
      github.run_attempt == '1' && inputs.confirmation == 'probe Grep in the isolated Cloudflare preview'
    environment: subs-bot-isolation
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the artifact and run one token-gated preview
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          PROBE_ARTIFACT_SHA256: ${{ needs.build.outputs.artifact-sha256 }}
          PROBE_MODULE_SHA256: ${{ needs.build.outputs.module-sha256 }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout 200s python3 -B worker/tools/grep_edge_preview.py
