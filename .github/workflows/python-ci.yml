name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test scripts
        run: |
          status=0
          for test_file in tests/test_*.py; do
            echo "::group::$test_file"
            python "$test_file" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Check exported config with Sing-box
        run: |
          workdir="$(mktemp -d)"
          trap 'rm -rf -- "$workdir"' EXIT
          archive="$workdir/sing-box.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$workdir"
          python tests/test_structured_export_regressions.py --emit-singbox > "$workdir/shadowsocks.json"
          python tests/test_singbox_export.py --emit-singbox > "$workdir/protocols.json"
          python tests/test_hysteria2_import.py --emit-singbox > "$workdir/hysteria2-import.json"
          singbox="$workdir/sing-box-1.14.4-linux-amd64/sing-box"
          "$singbox" check -c "$workdir/shadowsocks.json"
          "$singbox" check -c "$workdir/protocols.json"
          "$singbox" check -c "$workdir/hysteria2-import.json"
