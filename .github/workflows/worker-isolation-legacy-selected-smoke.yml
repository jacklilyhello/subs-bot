name: Verify isolated legacy selected aggregates

on:
  workflow_dispatch:
    inputs:
      action:
        description: Protected synthetic fixture phase
        required: true
        type: choice
        options: [prepare, reserve, verify, retire]
      cohort:
        description: Unique 32-character lowercase hexadecimal synthetic cohort
        required: true
        type: string
      source_run_id:
        description: Successful checkpoint run ID (empty for prepare)
        type: string
      confirm_retire:
        description: For retirement, enter retire followed by one space and the cohort
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: subs-bot-isolation-deploy
  cancel-in-progress: false

jobs:
  smoke:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main'
    environment: subs-bot-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify only the fixed synthetic legacy selected aggregate cohort
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_TELEGRAM_AGGREGATE_KEY: ${{ secrets.SUBS_BOT_TELEGRAM_AGGREGATE_KEY }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/legacy_selected_fixture_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subs-bot-legacy-selected-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-selected-checkpoint.json
          if-no-files-found: error
          retention-days: 30
