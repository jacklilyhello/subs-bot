name: Observe dedicated rehearsal backup health
run-name: Observe rehearsal backup health at ${{ github.sha }}

on:
  schedule:
    - cron: '3 * * * *'
    - cron: '18 * * * *'
    - cron: '33 * * * *'
    - cron: '48 * * * *'
  workflow_dispatch:
    inputs:
      registration_sha256:
        description: Independently recorded dedicated rehearsal registration SHA-256
        required: true
        type: string
      overdue_hours:
        description: Alert after this many hours without a verified completed backup
        default: '48'
        type: string
      timeout_minutes:
        description: Alert if a backup run remains unfinished beyond this many minutes
        default: '30'
        type: string

permissions:
  actions: read
  contents: read

jobs:
  observe:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main'
    environment: subs-bot-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      status: ${{ steps.gate.outputs.status || steps.monitor.outputs.status }}
      alerts_json: ${{ steps.gate.outputs.alerts_json || steps.monitor.outputs.alerts_json }}
      report_sha256: ${{ steps.monitor.outputs.report_sha256 }}
      notification_relevant: ${{ steps.gate.outputs.notification_relevant || steps.monitor.outputs.notification_relevant }}
    steps:
      - name: Check whether scheduled monitoring is enabled
        id: gate
        env:
          MONITOR_ENABLED: ${{ vars.SUBS_BOT_REHEARSAL_BACKUP_MONITOR_ENABLED }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$MONITOR_ENABLED" != true ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'status=disabled' >> "$GITHUB_OUTPUT"
            echo 'alerts_json=["monitor-disabled"]' >> "$GITHUB_OUTPUT"
            echo 'notification_relevant=true' >> "$GITHUB_OUTPUT"
            echo '::warning::Scheduled rehearsal backup monitoring is disabled; no health observation was made.'
            echo 'Scheduled rehearsal backup monitoring is disabled; no health observation was made.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read registered backup journals and hosted run status
        id: monitor
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CONTROL_ENVIRONMENT: subs-bot-isolation
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_ISOLATION_DATA_READ_TOKEN }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          DRILL_REGISTRATION_SHA256: ${{ inputs.registration_sha256 || vars.SUBS_BOT_REHEARSAL_REGISTRATION_SHA256 }}
          DRILL_BACKUP_GENESIS_SHA256: ${{ vars.SUBS_BOT_REHEARSAL_BACKUP_GENESIS_SHA256 }}
          MONITOR_OVERDUE_HOURS: ${{ inputs.overdue_hours }}
          MONITOR_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          MONITOR_CAPACITY_INTERVAL_MINUTES: ${{ vars.SUBS_BOT_REHEARSAL_CAPACITY_INTERVAL_MINUTES || '15' }}
          MONITOR_WARNING_PERCENT: ${{ vars.SUBS_BOT_REHEARSAL_BACKUP_WARNING_PERCENT || '80' }}
          MONITOR_NOTIFICATION_FILTER: ${{ vars.SUBS_BOT_REHEARSAL_BACKUP_NOTIFICATION_FILTER || '*' }}
          MONITOR_SCHEDULE: ${{ github.event.schedule }}
          DRILL_BACKUP_SOURCE_CHECKPOINT_ID: ${{ vars.SUBS_BOT_REHEARSAL_BACKUP_SOURCE_CHECKPOINT_ID }}
          DRILL_BACKUP_SOURCE_MANIFEST_SHA256: ${{ vars.SUBS_BOT_REHEARSAL_BACKUP_SOURCE_MANIFEST_SHA256 }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          python3 -B worker/tools/production_backup_monitor.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.gate.outputs.enabled == 'true'
        with:
          name: subs-bot-backup-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-backup-monitor.json
          if-no-files-found: error
          retention-days: 7
