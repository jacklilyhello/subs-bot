name: Provider Fetch CI

on:
  pull_request:
    paths:
      - 'worker/provider_fetch/**'
      - 'worker/src/provider-fetch-contract.ts'
      - 'worker/tools/bootstrap_provider_worker.py'
      - 'worker/tools/activate_provider_isolation.py'
      - 'worker/tools/install_provider_skopeo.sh'
      - 'worker/tools/prepare_provider_artifact.py'
      - 'worker/tools/prepare_isolation_artifact.py'
      - 'worker/tools/publish_provider_registry.py'
      - 'worker/tools/stage_provider_version.py'
      - 'worker/tools/verify_provider_skopeo.py'
      - 'worker/test/test_bootstrap_provider_worker.py'
      - 'worker/test/test_activate_provider_isolation.py'
      - 'worker/test/test_prepare_provider_artifact.py'
      - 'worker/test/test_publish_provider_registry.py'
      - 'worker/test/test_stage_provider_version.py'
      - '.github/workflows/worker-provider-artifact-preflight.yml'
      - '.github/workflows/worker-provider-bootstrap.yml'
      - '.github/workflows/worker-provider-isolation-activate.yml'
      - '.github/workflows/worker-provider-live-samples.yml'
      - '.github/workflows/worker-provider-fetch-ci.yml'
      - '.github/workflows/worker-provider-registry-publish.yml'
      - '.github/workflows/worker-provider-version-stage.yml'
  push:
    branches: [main]
    paths:
      - 'worker/provider_fetch/**'
      - 'worker/src/provider-fetch-contract.ts'
      - 'worker/tools/bootstrap_provider_worker.py'
      - 'worker/tools/activate_provider_isolation.py'
      - 'worker/tools/install_provider_skopeo.sh'
      - 'worker/tools/prepare_provider_artifact.py'
      - 'worker/tools/prepare_isolation_artifact.py'
      - 'worker/tools/publish_provider_registry.py'
      - 'worker/tools/stage_provider_version.py'
      - 'worker/tools/verify_provider_skopeo.py'
      - 'worker/test/test_bootstrap_provider_worker.py'
      - 'worker/test/test_activate_provider_isolation.py'
      - 'worker/test/test_prepare_provider_artifact.py'
      - 'worker/test/test_publish_provider_registry.py'
      - 'worker/test/test_stage_provider_version.py'
      - '.github/workflows/worker-provider-artifact-preflight.yml'
      - '.github/workflows/worker-provider-bootstrap.yml'
      - '.github/workflows/worker-provider-isolation-activate.yml'
      - '.github/workflows/worker-provider-live-samples.yml'
      - '.github/workflows/worker-provider-fetch-ci.yml'
      - '.github/workflows/worker-provider-registry-publish.yml'
      - '.github/workflows/worker-provider-version-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install only the pinned transport wheels
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: \
            --require-hashes -r worker/provider_fetch/requirements.txt
          python -m pip check
      - name: Exercise pinned transport and private ingress
        run: python -m unittest discover -s worker/provider_fetch -p 'test_*.py'
      - name: Test release provenance without network access
        run: python -B -m unittest discover -s worker/test -p 'test_prepare_provider_artifact.py'
      - name: Test guarded registry publication without network access
        run: python -B -m unittest discover -s worker/test -p 'test_publish_provider_registry.py'
      - name: Test the private Worker bootstrap without network access
        run: python -B -m unittest discover -s worker/test -p 'test_bootstrap_provider_worker.py'
      - name: Test private Worker version staging without network access
        run: python -B -m unittest discover -s worker/test -p 'test_stage_provider_version.py'
      - name: Test guarded provider activation and recovery without network access
        run: python -B -m unittest discover -s worker/test -p 'test_activate_provider_isolation.py'

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Typecheck and exercise the emitted private Worker
        working-directory: worker
        run: |
          test "$(git rev-parse HEAD)" = "$BUILD_REVISION"
          npm ci --ignore-scripts
          mkdir -p "$RUNNER_TEMP/subs-bot-provider"
          ./node_modules/.bin/tsc -p provider_fetch/tsconfig.json
          ./node_modules/.bin/esbuild provider_fetch/worker.ts --bundle --format=esm --platform=browser \
            --external:cloudflare:workers --target=es2022 --outfile="$RUNNER_TEMP/subs-bot-provider/provider-worker.js"
          PROVIDER_WORKER_BUNDLE="$RUNNER_TEMP/subs-bot-provider/provider-worker.js" \
            node --test provider_fetch/test_worker.mjs
      - name: Build and verify the private OCI artifact
        working-directory: worker/provider_fetch
        run: |
          artifact="$RUNNER_TEMP/subs-bot-provider"
          trap 'docker rm -f provider-fetch-ci >/dev/null 2>&1 || true; docker buildx rm provider-fetch-ci >/dev/null 2>&1 || true' EXIT
          docker buildx create --name provider-fetch-ci --driver docker-container \
            --driver-opt 'image=moby/buildkit@sha256:97719ccb2ac86fb44fd36f330a6d302f63dddd5326f3ada24f9c05ccac0d9098'
          docker buildx build --builder provider-fetch-ci --platform linux/amd64 \
            --build-arg "BUILD_REVISION=$BUILD_REVISION" --provenance=false --sbom=false \
            --output "type=oci,oci-mediatypes=true,dest=$artifact/provider-image.tar" \
            --output "type=docker,name=provider-fetch-ci:tested,dest=$RUNNER_TEMP/provider-docker.tar" .
          python3 -B release_artifact.py pack "$artifact" "$BUILD_REVISION"
          docker load --input "$RUNNER_TEMP/provider-docker.tar"
          config_digest="$(jq -er .ociConfigSha256 "$artifact/provider-release.json")"
          test "$(docker image inspect --format '{{.Id}}' provider-fetch-ci:tested)" = "sha256:$config_digest"
          docker run --detach --name provider-fetch-ci --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 256m --cpus 0.0625 "sha256:$config_digest"
          docker exec -i provider-fetch-ci python -B - "$BUILD_REVISION" < probe_image.py
          python3 -B release_artifact.py config "$artifact" "$BUILD_REVISION" \
            --account-id aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa > "$RUNNER_TEMP/provider-private-config.json"
          jq -e '.workers_dev == false and .preview_urls == false and .observability.enabled == false and
            .name == "subs-bot-provider-fetch-dev-01" and (.containers | length == 1) and
            .compatibility_flags == ["enable_ctx_exports"] and
            .exports == {"ProviderContainer":{"type":"durable-object","storage":"sqlite"}} and
            (.workflows | length == 1) and
            ((has("durable_objects") or has("d1_databases") or has("r2_buckets") or has("routes") or has("triggers") or has("services")) | not)' \
            "$RUNNER_TEMP/provider-private-config.json" > /dev/null
      - name: Install the same pinned Skopeo used for publication
        run: bash worker/tools/install_provider_skopeo.sh
      - name: Verify the exact OCI archive with Skopeo offline
        run: |
          umask 077
          sudo unshare --net --setgid="$(id -g)" --setuid="$(id -u)" -- \
            /usr/bin/python3 -B worker/tools/verify_provider_skopeo.py \
              "$RUNNER_TEMP/subs-bot-provider" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subs-bot-provider-${{ env.BUILD_REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-provider/
          if-no-files-found: error
          retention-days: 14
