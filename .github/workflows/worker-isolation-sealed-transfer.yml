name: Seal fixed isolation configuration for an environment
run-name: Isolation configuration ${{ inputs.action }} ${{ inputs.mapping }} at ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only key pin plan, or seal the selected fixed configuration
        required: true
        type: choice
        options: [plan, seal]
      mapping:
        description: One fixed project isolation source and destination mapping
        required: true
        type: choice
        options: [backup-target, backup-keys, backup-bot, provider-archive-location, provider-live-location, provider-archive-target, provider-live-target]
      destination_key_id:
        description: Public key ID independently retrieved for the fixed destination
        required: true
        type: string
      destination_environment_id:
        description: Immutable ID independently retrieved for the fixed destination Environment
        required: true
        type: string
      destination_public_key:
        description: Base64 public key independently retrieved for the fixed destination
        required: true
        type: string
      source_metadata_json:
        description: Fresh operator-verified GitHub source Environment metadata attestation for sealing
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  plan:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && inputs.action == 'plan'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compute the fixed destination key pin without secrets
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_PHASE: plan
          TRANSFER_MAPPING: ${{ inputs.mapping }}
          TRANSFER_DESTINATION_ENVIRONMENT_ID: ${{ inputs.destination_environment_id }}
          TRANSFER_KEY_ID: ${{ inputs.destination_key_id }}
          TRANSFER_PUBLIC_KEY: ${{ inputs.destination_public_key }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/isolation_sealed_transfer.py
  isolation:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && inputs.action == 'seal' && vars.SUBS_BOT_SEALED_TRANSFER_ENABLED == 'true' && contains(fromJSON('["backup-target","backup-keys","backup-bot","provider-archive-location","provider-live-location"]'), inputs.mapping)
    environment: subs-bot-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TRANSFER_MAPPING: ${{ inputs.mapping }}
      TRANSFER_SOURCE_METADATA_JSON: ${{ inputs.source_metadata_json }}
      TRANSFER_SOURCE_METADATA_SHA256: ${{ vars.SUBS_BOT_SEALED_SOURCE_METADATA_SHA256 }}
      TRANSFER_SOURCE_ENVIRONMENT_ID: ${{ vars.SUBS_BOT_SEALED_SOURCE_ENVIRONMENT_ID }}
      TRANSFER_REGISTRATION_SHA256: ${{ vars.SUBS_BOT_REHEARSAL_REGISTRATION_SHA256 }}
      TRANSFER_SOURCE_EVIDENCE_SHA256: ${{ vars.SUBS_BOT_SEALED_SOURCE_EVIDENCE_SHA256 }}
      TRANSFER_DESTINATION_ENVIRONMENT_ID: ${{ inputs.destination_environment_id }}
      TRANSFER_SOURCE_ENVIRONMENT: subs-bot-isolation
      TRANSFER_DESTINATION_ENVIRONMENT: ${{ startsWith(inputs.mapping, 'backup-') && 'subs-bot-backup-head-isolation' || (inputs.mapping == 'provider-archive-location' && 'subs-bot-provider-archive-head-isolation' || 'subs-bot-provider-head-isolation') }}
      TRANSFER_SOURCE_NAME: ${{ inputs.mapping == 'backup-keys' && 'SUBS_BOT_CONTROL_DRILL_KEYS' || (inputs.mapping == 'backup-bot' && 'SUBS_BOT_TELEGRAM_TEST_CONFIG' || 'SUBS_BOT_CF_ISOLATION_TARGET_JSON') }}
      TRANSFER_DESTINATION_NAME: ${{ inputs.mapping == 'backup-keys' && 'SUBS_BOT_CONTROL_DRILL_KEYS' || (inputs.mapping == 'backup-bot' && 'SUBS_BOT_TELEGRAM_TEST_CONFIG' || (inputs.mapping == 'backup-target' && 'SUBS_BOT_CF_ISOLATION_TARGET_JSON' || 'SUBS_BOT_PROVIDER_ARCHIVE_TARGET_JSON')) }}
      TRANSFER_DESTINATION_KEY_PIN: ${{ startsWith(inputs.mapping, 'backup-') && vars.SUBS_BOT_SEALED_BACKUP_KEY_PIN || (inputs.mapping == 'provider-archive-location' && vars.SUBS_BOT_SEALED_PROVIDER_ARCHIVE_KEY_PIN || vars.SUBS_BOT_SEALED_PROVIDER_HEAD_KEY_PIN) }}
      TRANSFER_KEY_ID: ${{ inputs.destination_key_id }}
      TRANSFER_PUBLIC_KEY: ${{ inputs.destination_public_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify fixed source, destination and protected key pin
        env:
          TRANSFER_PHASE: gate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/isolation_sealed_transfer.py
      - name: Independently attest registered test configuration and source identities
        id: attest
        env:
          TRANSFER_PHASE: attest
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_SEALED_WORKER_READ_TOKEN: ${{ secrets.SUBS_BOT_SEALED_WORKER_READ_TOKEN }}
          SUBS_BOT_SEALED_R2_ACCESS_KEY_ID: ${{ secrets.SUBS_BOT_SEALED_R2_ACCESS_KEY_ID }}
          SUBS_BOT_SEALED_R2_SECRET_ACCESS_KEY: ${{ secrets.SUBS_BOT_SEALED_R2_SECRET_ACCESS_KEY }}
          SUBS_BOT_SEALED_SOURCE_EVIDENCE_JSON: ${{ secrets.SUBS_BOT_SEALED_SOURCE_EVIDENCE_JSON }}
        run: python3 -B worker/tools/isolation_sealed_transfer.py
      - name: Seal the isolated target only
        if: inputs.mapping == 'backup-target' || inputs.mapping == 'provider-archive-location' || inputs.mapping == 'provider-live-location'
        env:
          TRANSFER_PHASE: seal
          TRANSFER_ATTESTED_METADATA_SHA256: ${{ steps.attest.outputs.metadata_sha256 }}
          TRANSFER_ATTESTED_SOURCE_SHA256: ${{ steps.attest.outputs.source_sha256 }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_SEALED_WORKER_READ_TOKEN: ${{ secrets.SUBS_BOT_SEALED_WORKER_READ_TOKEN }}
          SUBS_BOT_SEALED_R2_ACCESS_KEY_ID: ${{ secrets.SUBS_BOT_SEALED_R2_ACCESS_KEY_ID }}
          SUBS_BOT_SEALED_R2_SECRET_ACCESS_KEY: ${{ secrets.SUBS_BOT_SEALED_R2_SECRET_ACCESS_KEY }}
          SUBS_BOT_SEALED_SOURCE_EVIDENCE_JSON: ${{ secrets.SUBS_BOT_SEALED_SOURCE_EVIDENCE_JSON }}
          TRANSFER_SOURCE_VALUE: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
        run: python3 -B worker/tools/isolation_sealed_transfer.py
      - name: Seal the isolated signing configuration only
        if: inputs.mapping == 'backup-keys'
        env:
          TRANSFER_PHASE: seal
          TRANSFER_ATTESTED_METADATA_SHA256: ${{ steps.attest.outputs.metadata_sha256 }}
          TRANSFER_ATTESTED_SOURCE_SHA256: ${{ steps.attest.outputs.source_sha256 }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_SEALED_WORKER_READ_TOKEN: ${{ secrets.SUBS_BOT_SEALED_WORKER_READ_TOKEN }}
          SUBS_BOT_SEALED_R2_ACCESS_KEY_ID: ${{ secrets.SUBS_BOT_SEALED_R2_ACCESS_KEY_ID }}
          SUBS_BOT_SEALED_R2_SECRET_ACCESS_KEY: ${{ secrets.SUBS_BOT_SEALED_R2_SECRET_ACCESS_KEY }}
          SUBS_BOT_SEALED_SOURCE_EVIDENCE_JSON: ${{ secrets.SUBS_BOT_SEALED_SOURCE_EVIDENCE_JSON }}
          TRANSFER_SOURCE_VALUE: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
        run: python3 -B worker/tools/isolation_sealed_transfer.py
      - name: Seal the authorized test Bot configuration only
        if: inputs.mapping == 'backup-bot'
        env:
          TRANSFER_PHASE: seal
          TRANSFER_ATTESTED_METADATA_SHA256: ${{ steps.attest.outputs.metadata_sha256 }}
          TRANSFER_ATTESTED_SOURCE_SHA256: ${{ steps.attest.outputs.source_sha256 }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_SEALED_WORKER_READ_TOKEN: ${{ secrets.SUBS_BOT_SEALED_WORKER_READ_TOKEN }}
          SUBS_BOT_SEALED_R2_ACCESS_KEY_ID: ${{ secrets.SUBS_BOT_SEALED_R2_ACCESS_KEY_ID }}
          SUBS_BOT_SEALED_R2_SECRET_ACCESS_KEY: ${{ secrets.SUBS_BOT_SEALED_R2_SECRET_ACCESS_KEY }}
          SUBS_BOT_SEALED_SOURCE_EVIDENCE_JSON: ${{ secrets.SUBS_BOT_SEALED_SOURCE_EVIDENCE_JSON }}
          TRANSFER_SOURCE_VALUE: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: python3 -B worker/tools/isolation_sealed_transfer.py
      - name: Upload sealed ciphertext only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolation-sealed-transfer-${{ inputs.mapping }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/isolation-sealed-transfer.json
          if-no-files-found: error
          retention-days: 1

  provider:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && inputs.action == 'seal' && vars.SUBS_BOT_SEALED_TRANSFER_ENABLED == 'true' && (inputs.mapping == 'provider-archive-target' || inputs.mapping == 'provider-live-target')
    environment: subs-bot-provider-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TRANSFER_MAPPING: ${{ inputs.mapping }}
      TRANSFER_SOURCE_METADATA_JSON: ${{ inputs.source_metadata_json }}
      TRANSFER_SOURCE_METADATA_SHA256: ${{ vars.SUBS_BOT_SEALED_SOURCE_METADATA_SHA256 }}
      TRANSFER_SOURCE_ENVIRONMENT_ID: ${{ vars.SUBS_BOT_SEALED_SOURCE_ENVIRONMENT_ID }}
      TRANSFER_PROVIDER_TARGET_SHA256: ${{ vars.SUBS_BOT_SEALED_PROVIDER_TARGET_SHA256 }}
      TRANSFER_DESTINATION_ENVIRONMENT_ID: ${{ inputs.destination_environment_id }}
      TRANSFER_SOURCE_ENVIRONMENT: subs-bot-provider-isolation
      TRANSFER_DESTINATION_ENVIRONMENT: ${{ inputs.mapping == 'provider-archive-target' && 'subs-bot-provider-archive-head-isolation' || 'subs-bot-provider-head-isolation' }}
      TRANSFER_SOURCE_NAME: SUBS_BOT_PROVIDER_CONTROL_TARGET_JSON
      TRANSFER_DESTINATION_NAME: SUBS_BOT_PROVIDER_CONTROL_TARGET_JSON
      TRANSFER_DESTINATION_KEY_PIN: ${{ inputs.mapping == 'provider-archive-target' && vars.SUBS_BOT_SEALED_PROVIDER_ARCHIVE_KEY_PIN || vars.SUBS_BOT_SEALED_PROVIDER_HEAD_KEY_PIN }}
      TRANSFER_KEY_ID: ${{ inputs.destination_key_id }}
      TRANSFER_PUBLIC_KEY: ${{ inputs.destination_public_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify fixed source, destination and protected key pin
        env:
          TRANSFER_PHASE: gate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/isolation_sealed_transfer.py
      - name: Independently attest the protected Provider target
        id: attest
        env:
          TRANSFER_PHASE: attest
          SUBS_BOT_PROVIDER_CONTROL_TARGET_JSON: ${{ secrets.SUBS_BOT_PROVIDER_CONTROL_TARGET_JSON }}
        run: python3 -B worker/tools/isolation_sealed_transfer.py
      - name: Seal the isolated Provider target only
        env:
          TRANSFER_PHASE: seal
          TRANSFER_ATTESTED_METADATA_SHA256: ${{ steps.attest.outputs.metadata_sha256 }}
          TRANSFER_ATTESTED_SOURCE_SHA256: ${{ steps.attest.outputs.source_sha256 }}
          SUBS_BOT_PROVIDER_CONTROL_TARGET_JSON: ${{ secrets.SUBS_BOT_PROVIDER_CONTROL_TARGET_JSON }}
          TRANSFER_SOURCE_VALUE: ${{ secrets.SUBS_BOT_PROVIDER_CONTROL_TARGET_JSON }}
        run: python3 -B worker/tools/isolation_sealed_transfer.py
      - name: Upload sealed ciphertext only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolation-sealed-transfer-${{ inputs.mapping }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/isolation-sealed-transfer.json
          if-no-files-found: error
          retention-days: 1
