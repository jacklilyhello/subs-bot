name: Run a reviewed backup head in isolated rehearsal
run-name: Reviewed backup head validation at ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The dedicated isolated backup validation environment
        type: choice
        options: [subs-bot-backup-head-isolation]
        required: true
      validation_json:
        description: Exact reviewed PR head, action and private source pins
        type: string
        required: true

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: subs-bot-lifecycle-rehearsal
  cancel-in-progress: false

jobs:
  validate:
    # The enable switch is a repository variable and is absent by default.
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.environment == 'subs-bot-backup-head-isolation' && vars.SUBS_BOT_BACKUP_HEAD_VALIDATION_ENABLED == 'true'
    environment: subs-bot-backup-head-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      snapshot_sha256: ${{ steps.candidate.outputs.snapshot_sha256 }}
    steps:
      - name: Check out the trusted current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'
      - name: Verify the exact independently reviewed head before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_HEAD_ENVIRONMENT: subs-bot-backup-head-isolation
          BACKUP_REVIEWED_HEAD_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
          BACKUP_CAPACITY_ENABLED: ${{ vars.SUBS_BOT_BACKUP_CAPACITY_VALIDATION_ENABLED }}
          BACKUP_CHECKOUT_PHASE: before
          HEAD_VALIDATION_JSON: ${{ inputs.validation_json }}
        run: python3 -B trusted/worker/tools/trusted_backup_head_gate.py
      - name: Check out the immutable reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(inputs.validation_json).headSha }}
          path: candidate
          persist-credentials: false
      - name: Independently recheck trusted main and candidate checkout
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_HEAD_ENVIRONMENT: subs-bot-backup-head-isolation
          BACKUP_REVIEWED_HEAD_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
          BACKUP_CAPACITY_ENABLED: ${{ vars.SUBS_BOT_BACKUP_CAPACITY_VALIDATION_ENABLED }}
          BACKUP_CHECKOUT_PHASE: ready
          HEAD_VALIDATION_JSON: ${{ inputs.validation_json }}
        run: python3 -B trusted/worker/tools/trusted_backup_head_gate.py
      - name: Confirm only the authorized isolated test identity
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_HEAD_ENVIRONMENT: subs-bot-backup-head-isolation
          BACKUP_REVIEWED_HEAD_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
          BACKUP_CAPACITY_ENABLED: ${{ vars.SUBS_BOT_BACKUP_CAPACITY_VALIDATION_ENABLED }}
          BACKUP_CHECKOUT_PHASE: credential-check
          HEAD_VALIDATION_JSON: ${{ inputs.validation_json }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: python3 -B trusted/worker/tools/trusted_backup_head_gate.py
      - name: Confirm independently pinned capacity fixture identity
        if: fromJSON(inputs.validation_json).action == 'capacity-fixture'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_HEAD_ENVIRONMENT: subs-bot-backup-head-isolation
          BACKUP_REVIEWED_HEAD_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
          BACKUP_CAPACITY_ENABLED: ${{ vars.SUBS_BOT_BACKUP_CAPACITY_VALIDATION_ENABLED }}
          BACKUP_CHECKOUT_PHASE: fixture-credential-check
          HEAD_VALIDATION_JSON: ${{ inputs.validation_json }}
          CAPACITY_FIXTURE_MODE: ${{ vars.SUBS_BOT_BACKUP_CAPACITY_MODE }}
          CAPACITY_FIXTURE_REGISTRATION_JSON: ${{ secrets.CAPACITY_FIXTURE_REGISTRATION_JSON }}
          CAPACITY_FIXTURE_REGISTRATION_SHA256: ${{ secrets.CAPACITY_FIXTURE_REGISTRATION_SHA256 }}
          CAPACITY_FIXTURE_BINDING_WITNESS_JSON: ${{ secrets.CAPACITY_FIXTURE_BINDING_WITNESS_JSON }}
          CAPACITY_FIXTURE_BINDING_WITNESS_SHA256: ${{ secrets.CAPACITY_FIXTURE_BINDING_WITNESS_SHA256 }}
          CAPACITY_FIXTURE_REHEARSAL_D1_ID: ${{ secrets.CAPACITY_FIXTURE_REHEARSAL_D1_ID }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
        run: python3 -B trusted/worker/tools/trusted_backup_head_gate.py
      - name: Run the reviewed candidate against only dedicated isolation
        id: candidate
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CONTROL_ENVIRONMENT: subs-bot-isolation
          HEAD_VALIDATION_JSON: ${{ inputs.validation_json }}
          HEAD_TRUSTED_MAIN_SHA: ${{ github.sha }}
          HEAD_TRUSTED_REVIEWED_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
          HEAD_TRUSTED_WEBHOOK_CLEANUP: ${{ fromJSON(inputs.validation_json).action == 'open-backup' && 'configured-v1' || '' }}
          HEAD_ACTION: ${{ fromJSON(inputs.validation_json).action }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_SCOPED_R2_WRITE_JSON: ${{ (fromJSON(inputs.validation_json).action != 'capacity-fixture' || !startsWith(vars.SUBS_BOT_BACKUP_CAPACITY_MODE, 'verify-')) && secrets.SUBS_BOT_SCOPED_R2_WRITE_JSON || '' }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ (fromJSON(inputs.validation_json).action == 'capacity-fixture' && secrets.SUBS_BOT_CF_REHEARSAL_DATA_READ_TOKEN) || (fromJSON(inputs.validation_json).action != 'capacity-fixture' && secrets.SUBS_BOT_CF_REHEARSAL_DATA_TOKEN) || '' }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_WORKER_READ_TOKEN }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          CAPACITY_FIXTURE_MODE: ${{ fromJSON(inputs.validation_json).action == 'capacity-fixture' && vars.SUBS_BOT_BACKUP_CAPACITY_MODE || '' }}
          CAPACITY_FIXTURE_REGISTRATION_JSON: ${{ fromJSON(inputs.validation_json).action == 'capacity-fixture' && secrets.CAPACITY_FIXTURE_REGISTRATION_JSON || '' }}
          CAPACITY_FIXTURE_REGISTRATION_SHA256: ${{ fromJSON(inputs.validation_json).action == 'capacity-fixture' && secrets.CAPACITY_FIXTURE_REGISTRATION_SHA256 || '' }}
          CAPACITY_FIXTURE_BINDING_WITNESS_JSON: ${{ fromJSON(inputs.validation_json).action == 'capacity-fixture' && secrets.CAPACITY_FIXTURE_BINDING_WITNESS_JSON || '' }}
          CAPACITY_FIXTURE_BINDING_WITNESS_SHA256: ${{ fromJSON(inputs.validation_json).action == 'capacity-fixture' && secrets.CAPACITY_FIXTURE_BINDING_WITNESS_SHA256 || '' }}
          CAPACITY_FIXTURE_D1_READ_TOKEN: ${{ fromJSON(inputs.validation_json).action == 'capacity-fixture' && startsWith(vars.SUBS_BOT_BACKUP_CAPACITY_MODE, 'verify-') && secrets.CAPACITY_FIXTURE_D1_READ_TOKEN || '' }}
          CAPACITY_FIXTURE_D1_WRITE_TOKEN: ${{ fromJSON(inputs.validation_json).action == 'capacity-fixture' && !startsWith(vars.SUBS_BOT_BACKUP_CAPACITY_MODE, 'verify-') && secrets.CAPACITY_FIXTURE_D1_WRITE_TOKEN || '' }}
        run: |
          umask 077
          python3 -B worker/tools/production_backup_head_harness.py
          if [ "$HEAD_ACTION" = 'open-backup' ]; then
            pin=$(jq -er '.snapshotSha256 | select(type == "string" and test("^[0-9a-f]{64}$"))' "$RUNNER_TEMP/backup-webhook-snapshot-pin.json")
            printf 'snapshot_sha256=%s\n' "$pin" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: subs-bot-reviewed-backup-head-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-backup-head-result.json
          if-no-files-found: warn
          retention-days: 7
  trusted_cleanup:
    needs: [validate]
    if: always() && github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.environment == 'subs-bot-backup-head-isolation' && vars.SUBS_BOT_BACKUP_HEAD_VALIDATION_ENABLED == 'true' && fromJSON(inputs.validation_json).action == 'open-backup'
    environment: subs-bot-backup-head-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted current main on a fresh runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Confirm trusted main checkout
        run: test "$(git -C trusted rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Trusted inspect original webhook snapshot
        id: webhook_snapshot
        if: always() && fromJSON(inputs.validation_json).action == 'open-backup'
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_RECOVERY_ACTION: inspect
          WEBHOOK_SOURCE_RUN_ID: ${{ github.run_id }}
          WEBHOOK_SOURCE_ATTEMPT: ${{ github.run_attempt }}
          WEBHOOK_SOURCE_MAIN_SHA: ${{ github.sha }}
          WEBHOOK_SOURCE_CANDIDATE_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
          WEBHOOK_REVIEWED_CANDIDATE_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
          WEBHOOK_REGISTRATION_SHA256: ${{ fromJSON(inputs.validation_json).registrationSha256 }}
          WEBHOOK_SNAPSHOT_SHA256: ${{ needs.validate.outputs.snapshot_sha256 }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_DATA_TOKEN }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: python3 -B trusted/worker/tools/production_backup_webhook_recovery.py
      - name: Trusted close and freeze isolated admission
        id: admission_cleanup
        if: always() && fromJSON(inputs.validation_json).action == 'open-backup' && steps.webhook_snapshot.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_SOURCE_RUN_ID: ${{ github.run_id }}
          WEBHOOK_SOURCE_ATTEMPT: ${{ github.run_attempt }}
          WEBHOOK_SOURCE_MAIN_SHA: ${{ github.sha }}
          WEBHOOK_SOURCE_CANDIDATE_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
          WEBHOOK_REVIEWED_CANDIDATE_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
          WEBHOOK_REGISTRATION_SHA256: ${{ fromJSON(inputs.validation_json).registrationSha256 }}
          WEBHOOK_SNAPSHOT_SHA256: ${{ needs.validate.outputs.snapshot_sha256 }}
          BACKUP_SOURCE_CHECKPOINT_ID: ${{ fromJSON(inputs.validation_json).sourceCheckpointId }}
          BACKUP_SOURCE_MANIFEST_SHA256: ${{ fromJSON(inputs.validation_json).sourceManifestSha256 }}
          BACKUP_GENESIS_SHA256: ${{ fromJSON(inputs.validation_json).genesisSha256 }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_SCOPED_R2_WRITE_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_WRITE_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_DATA_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_WORKER_READ_TOKEN }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: python3 -B trusted/worker/tools/production_backup_admission_recovery.py
      - name: Trusted restore original test webhook
        if: always() && fromJSON(inputs.validation_json).action == 'open-backup' && steps.admission_cleanup.outcome == 'success' && steps.webhook_snapshot.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_RECOVERY_ACTION: restore
          WEBHOOK_SOURCE_RUN_ID: ${{ github.run_id }}
          WEBHOOK_SOURCE_ATTEMPT: ${{ github.run_attempt }}
          WEBHOOK_SOURCE_MAIN_SHA: ${{ github.sha }}
          WEBHOOK_SOURCE_CANDIDATE_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
          WEBHOOK_REVIEWED_CANDIDATE_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
          WEBHOOK_REGISTRATION_SHA256: ${{ fromJSON(inputs.validation_json).registrationSha256 }}
          WEBHOOK_SNAPSHOT_SHA256: ${{ steps.webhook_snapshot.outputs.snapshot_sha256 }}
          WEBHOOK_FREEZE_CONFIRMATION_SHA256: ${{ steps.admission_cleanup.outputs.freeze_confirmation_sha256 }}
          WEBHOOK_SOURCE_CHECKPOINT_ID: ${{ fromJSON(inputs.validation_json).sourceCheckpointId }}
          WEBHOOK_SOURCE_MANIFEST_SHA256: ${{ fromJSON(inputs.validation_json).sourceManifestSha256 }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_SCOPED_R2_WRITE_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_WRITE_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_DATA_TOKEN }}
          SUBS_BOT_CF_REHEARSAL_WORKER_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_WORKER_READ_TOKEN }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: python3 -B trusted/worker/tools/production_backup_webhook_recovery.py
