name: Rehearse private general Telegram reads
on:
  workflow_dispatch:
    inputs:
      action:
        description: Exact isolated read-lane checkpoint
        type: choice
        default: inspect
        options: [inspect, close, open, restore]
      source_run_id:
        description: Successful exact-main Worker CI run (required for the initial inspect, close and open)
        type: string
      active_sha256:
        description: Active immutable Worker digest from protected inspect (required for any write or recovery)
        type: string
      state_sha256:
        description: Exact predecessor digest from protected inspect (required for any write)
        type: string
      confirmation:
        description: Exact confirmation for a write, e.g. close private general reads for subs-bot-cf-dev-01
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: subs-bot-isolation-deploy
  cancel-in-progress: false

jobs:
  checkpoint:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main'
    environment: subs-bot-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the exact main and isolated read lane
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CI_RUN_ID: ${{ inputs.source_run_id }}
          GENERAL_READ_ACTION: ${{ inputs.action }}
          GENERAL_READ_ACTIVE_SHA256: ${{ inputs.active_sha256 }}
          GENERAL_READ_STATE_SHA256: ${{ inputs.state_sha256 }}
          GENERAL_READ_CONFIRMATION: ${{ inputs.confirmation }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/general_read_rehearsal.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: general-read-rehearsal-${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/general-read-rehearsal.json
          retention-days: 7
          if-no-files-found: error
