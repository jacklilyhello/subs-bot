name: Verify caller-only shortlink failure and recovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: Bounded two-account drill, or recover its signed checkpoint
        type: choice
        options: [drill, restore]
        default: drill
      worker_ci_run_id:
        description: Drill only, successful Worker CI for exact current main
        type: string
      deploy_run_id:
        description: Drill only, matching successful ordinary isolation deployment
        type: string
      deploy_run_attempt:
        description: Exact ordinary deployment attempt
        type: string
        default: '1'
      cohort:
        description: Drill only, fresh 16-character lowercase hexadecimal challenge
        type: string
      checkpoint_run_id:
        description: Restore only, original drill run including failed or canceled runs
        type: string
      checkpoint_run_attempt:
        description: Restore only, exact original drill attempt
        type: string
        default: '1'
      confirmation:
        description: Exact action confirmation from the release guide
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: subs-bot-isolation-deploy
  cancel-in-progress: false

jobs:
  drill:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main'
    environment: subs-bot-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      SUBS_BOT_CI_RUN_ID: ${{ inputs.worker_ci_run_id }}
      SHORTLINK_FAULT_ACTION: ${{ inputs.action }}
      SHORTLINK_FAULT_DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
      SHORTLINK_FAULT_DEPLOY_RUN_ATTEMPT: ${{ inputs.deploy_run_attempt }}
      SHORTLINK_FAULT_COHORT: ${{ inputs.cohort }}
      SHORTLINK_FAULT_CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
      SHORTLINK_FAULT_CHECKPOINT_RUN_ATTEMPT: ${{ inputs.checkpoint_run_attempt }}
      SHORTLINK_FAULT_CONFIRMATION: ${{ inputs.confirmation }}
      SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
      SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
      SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
      SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
      SUBS_BOT_TELEGRAM_AGGREGATE_KEY: ${{ secrets.SUBS_BOT_TELEGRAM_AGGREGATE_KEY }}
      SUBS_BOT_TELEGRAM_PRIVATE_SHARE_CREATION_KEY: ${{ secrets.SUBS_BOT_TELEGRAM_PRIVATE_SHARE_CREATION_KEY }}
      SUBS_BOT_SHORTLINK_BUSINESS_TOKEN: ${{ secrets.SUBS_BOT_SHORTLINK_BUSINESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare verified normal and failure versions without activation
        id: prepare
        if: inputs.action == 'drill'
        env:
          SHORTLINK_FAULT_PHASE: prepare
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/shortlink_fault_drill.py
      - name: Persist signed recovery before any canary activation
        if: inputs.action == 'drill'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subs-bot-shortlink-fault-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shortlink-fault-checkpoint.json
          if-no-files-found: error
          retention-days: 7
      - name: Activate caller canary and await bounded IAB fallback evidence
        if: inputs.action == 'drill'
        env:
          SHORTLINK_FAULT_PHASE: run
        run: python3 -B worker/tools/shortlink_fault_drill.py
      - name: Independently restore the verified normal caller version
        if: always() && (inputs.action == 'restore' || steps.prepare.outcome == 'success')
        env:
          SHORTLINK_FAULT_PHASE: restore
        run: python3 -B worker/tools/shortlink_fault_drill.py
      - name: Retain only projected drill and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subs-bot-shortlink-fault-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shortlink-fault-result.json
            ${{ runner.temp }}/shortlink-fault-restore.json
          if-no-files-found: warn
          retention-days: 7
