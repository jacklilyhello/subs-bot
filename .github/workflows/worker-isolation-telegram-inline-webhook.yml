name: Inspect or append isolated Telegram inline webhook

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect the isolated webhook or append inline_query
        required: true
        default: inspect
        type: choice
        options: [inspect, append]
      confirmation:
        description: Exact append confirmation after verifying the original DNS webhook
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: subs-bot-isolation-deploy
  cancel-in-progress: false

jobs:
  webhook:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main'
    environment: subs-bot-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify owned resources and inspect or append inline delivery
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_INLINE_WEBHOOK_MODE: ${{ inputs.mode }}
          SUBS_BOT_INLINE_WEBHOOK_CONFIRMATION: ${{ inputs.confirmation }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/telegram_inline_webhook.py
