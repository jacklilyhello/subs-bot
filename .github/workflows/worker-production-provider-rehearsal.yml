name: Rehearse production ProviderFetch controls and seal proof
run-name: ProviderFetch production controls ${{ inputs.action }} at ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Run the dedicated private dependency rehearsal or independently read its R2 archive
        required: true
        type: choice
        options: [verify-archive, rehearse]
        default: verify-archive
      provider_ci_run_id:
        description: Successful Provider Fetch CI for this exact main, rehearsal only
        required: false
        type: string
      confirmation:
        description: Rehearsal only, exact dedicated resource confirmation
        required: false
        type: string
      health_url:
        description: Explicit approved public project /health fixture URL, rehearsal only
        required: false
        type: string
      health_revision:
        description: Exact independent fixture health revision, rehearsal only
        required: false
        type: string
      archive_run_id:
        description: Verify only, sealed rehearsal run
        required: false
        type: string
      archive_run_attempt:
        description: Verify only, exact sealed attempt
        required: false
        default: '1'
        type: string
      manifest_sha256:
        description: Verify only, independently recorded R2 manifest digest
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  rehearse:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && inputs.action == 'rehearse'
    environment: subs-bot-provider-isolation
    concurrency:
      group: subs-bot-provider-isolation
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install and verify the pinned registry client
        run: bash worker/tools/install_provider_skopeo.sh
      - name: Verify the exact source module and complete OCI closure
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_PROVIDER_CI_RUN_ID: ${{ inputs.provider_ci_run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          python3 -B worker/tools/prepare_provider_artifact.py > "$RUNNER_TEMP/provider-provenance.json"
      - name: Run the production code against the dedicated rehearsal identity
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_PROVIDER_CI_RUN_ID: ${{ inputs.provider_ci_run_id }}
          SUBS_BOT_PROVIDER_REHEARSAL_CONFIRMATION: ${{ inputs.confirmation }}
          SUBS_BOT_PROVIDER_REHEARSAL_HEALTH_URL: ${{ inputs.health_url }}
          SUBS_BOT_PROVIDER_REHEARSAL_HEALTH_REVISION: ${{ inputs.health_revision }}
          SUBS_BOT_PROVIDER_REHEARSAL_TARGET_JSON: ${{ secrets.SUBS_BOT_PROVIDER_REHEARSAL_TARGET_JSON }}
          SUBS_BOT_CF_PROVIDER_WORKER_TOKEN: ${{ secrets.SUBS_BOT_CF_PROVIDER_WORKER_TOKEN }}
          SUBS_BOT_CF_PROVIDER_CONTAINER_TOKEN: ${{ secrets.SUBS_BOT_CF_PROVIDER_CONTAINER_TOKEN }}
        run: |
          umask 077
          python3 -B worker/tools/production_provider_rehearsal.py
      - name: Assemble private source and completed proof
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/provider-proof-output/source"
          cp "$RUNNER_TEMP/subs-bot-provider-verified/provider-worker.js" "$RUNNER_TEMP/provider-proof-output/source/"
          cp "$RUNNER_TEMP/subs-bot-provider-verified/provider-release.json" "$RUNNER_TEMP/provider-proof-output/source/"
          cp "$RUNNER_TEMP/subs-bot-provider-verified/provider-image.tar" "$RUNNER_TEMP/provider-proof-output/source/"
          cp "$RUNNER_TEMP/provider-source-archive.zip" "$RUNNER_TEMP/provider-proof-output/"
          cp "$RUNNER_TEMP/provider-rehearsal-proof.json" "$RUNNER_TEMP/provider-proof-output/"
          cp "$RUNNER_TEMP/provider-rehearsal-target.json" "$RUNNER_TEMP/provider-proof-output/"
          cp "$RUNNER_TEMP/provider-rehearsal-journal.json" "$RUNNER_TEMP/provider-proof-output/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subs-bot-provider-control-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-proof-output/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: subs-bot-provider-control-checkpoint-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/provider-rehearsal-target.json
            ${{ runner.temp }}/provider-rehearsal-journal.json
          retention-days: 7
          if-no-files-found: warn

  private-proof:
    needs: rehearse
    if: >-
      always() && github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' &&
      ((inputs.action == 'rehearse' && needs.rehearse.result == 'success') || inputs.action == 'verify-archive')
    environment: subs-bot-isolation
    concurrency:
      group: subs-bot-isolation-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.action == 'rehearse'
        with:
          name: subs-bot-provider-control-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-proof-input
      - name: Archive or independently read the complete private source proof
        env:
          PROVIDER_ARCHIVE_ACTION: ${{ inputs.action == 'rehearse' && 'archive' || 'verify' }}
          PROVIDER_ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
          PROVIDER_ARCHIVE_RUN_ATTEMPT: ${{ inputs.archive_run_attempt }}
          PROVIDER_ARCHIVE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          python3 -B worker/tools/archive_production_provider.py
