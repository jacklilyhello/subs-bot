name: Worker CI

on:
  pull_request:
    paths: ['worker/**', '.github/workflows/worker-ci.yml']
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$BUILD_REVISION"
          npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check TypeScript
        run: npm run check
      - name: Build Worker module
        run: npm run build
      - name: Test Worker
        run: npm test
      - name: Package exact revision and synthetic fixture
        run: |
          mkdir -p "$RUNNER_TEMP/subs-bot-worker"
          cp dist/index.js "$RUNNER_TEMP/subs-bot-worker/index.js"
          cp migrations/0001_subscriptions.sql "$RUNNER_TEMP/subs-bot-worker/0001_subscriptions.sql"
          node tools/isolation-fixture.mjs "$RUNNER_TEMP/subs-bot-worker"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subs-bot-worker-${{ env.BUILD_REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-worker/
          if-no-files-found: error
          retention-days: 7
      - name: Check isolated Cloudflare deployment
        if: >-
          vars.SUBS_BOT_ISOLATION_REVISION == env.BUILD_REVISION &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: node tools/isolation-smoke.mjs "$RUNNER_TEMP/subs-bot-worker/isolation.json"
