name: Worker CI

on:
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker-ci.yml'
      - '.github/workflows/worker-isolation-deploy.yml'
      - '.github/workflows/worker-production-candidate.yml'
      - '.github/workflows/worker-isolation-command-menu.yml'
      - '.github/workflows/worker-isolation-general-window.yml'
      - '.github/workflows/worker-isolation-capacity.yml'
      - '.github/workflows/worker-isolation-capacity-recovery.yml'
      - '.github/workflows/worker-isolation-provider-journal-smoke.yml'
      - '.github/workflows/worker-isolation-telegram-fixtures.yml'
      - '.github/workflows/worker-isolation-telegram-claims.yml'
      - '.github/workflows/worker-isolation-telegram-inline-webhook.yml'
      - '.github/workflows/worker-isolation-private-share-command-smoke.yml'
      - '.github/workflows/worker-isolation-native-restore.yml'
      - '.github/workflows/worker-isolation-legacy-candidate.yml'
      - '.github/workflows/worker-isolation-legacy-selected-smoke.yml'
      - '.github/workflows/worker-isolation-telegram-selected-smoke.yml'
      - '.github/workflows/worker-isolation-telegram-short-links-smoke.yml'
      - '.github/workflows/worker-isolation-grep-outcome.yml'
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-ci.yml'
      - '.github/workflows/worker-isolation-deploy.yml'
      - '.github/workflows/worker-production-candidate.yml'
      - '.github/workflows/worker-isolation-command-menu.yml'
      - '.github/workflows/worker-isolation-general-window.yml'
      - '.github/workflows/worker-isolation-capacity.yml'
      - '.github/workflows/worker-isolation-capacity-recovery.yml'
      - '.github/workflows/worker-isolation-provider-journal-smoke.yml'
      - '.github/workflows/worker-isolation-telegram-fixtures.yml'
      - '.github/workflows/worker-isolation-telegram-claims.yml'
      - '.github/workflows/worker-isolation-telegram-inline-webhook.yml'
      - '.github/workflows/worker-isolation-private-share-command-smoke.yml'
      - '.github/workflows/worker-isolation-native-restore.yml'
      - '.github/workflows/worker-isolation-legacy-candidate.yml'
      - '.github/workflows/worker-isolation-legacy-selected-smoke.yml'
      - '.github/workflows/worker-isolation-telegram-selected-smoke.yml'
      - '.github/workflows/worker-isolation-telegram-short-links-smoke.yml'
      - '.github/workflows/worker-isolation-grep-outcome.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'
      - name: Verify Unicode 14 case-folding source
        run: |
          python3 -B tools/generate_casefold.py > "$RUNNER_TEMP/unicode14-casefold.ts"
          cmp src/unicode14-casefold.ts "$RUNNER_TEMP/unicode14-casefold.ts"
      - name: Generate Unicode 14 lowercase source on the hosted runner
        run: |
          python3 -B tools/generate_lowercase.py > "$RUNNER_TEMP/unicode14-lower.ts"
          cmp src/unicode14-lower.ts "$RUNNER_TEMP/unicode14-lower.ts"
      - name: Publish reproducible lowercase source for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subs-bot-unicode14-lower-${{ env.BUILD_REVISION }}
          path: ${{ runner.temp }}/unicode14-lower.ts
          if-no-files-found: error
          retention-days: 7
      - name: Install locked dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$BUILD_REVISION"
          npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check TypeScript
        run: npm run check
      - name: Build Worker module
        run: npm run build
      - name: Check isolated Worker module size
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, "tools")
          from cloudflare_isolation import MAX_MODULE_BYTES

          size = Path("dist/index.js").stat().st_size
          if not 0 < size <= MAX_MODULE_BYTES:
              raise SystemExit(f"Worker module size {size} is outside the supported range of 1 to {MAX_MODULE_BYTES} bytes.")
          print(f"Worker module size verified at {size} of {MAX_MODULE_BYTES} bytes.")
          PY
      - name: Test Worker
        run: npm test
      - name: Test release tooling
        run: python3 -m unittest discover -s test -p 'test_*.py'
      - name: Package exact revision and synthetic fixture
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/subs-bot-worker"
          cp dist/index.js "$RUNNER_TEMP/subs-bot-worker/index.js"
          git ls-files -z -- migrations | while IFS= read -r -d '' migration; do
            [[ "$migration" =~ ^migrations/[0-9]{4}_[a-z][a-z0-9_]*\.sql$ && -f "$migration" && ! -L "$migration" ]]
            cp -- "$migration" "$RUNNER_TEMP/subs-bot-worker/"
          done
          node tools/isolation-fixture.mjs "$RUNNER_TEMP/subs-bot-worker"
      - name: Test emitted bundle with D1 and R2 bindings
        env:
          WORKER_TEST_BUNDLE_DIR: ${{ runner.temp }}/subs-bot-worker
        run: |
          workdir="$(mktemp -d)"
          trap 'rm -rf -- "$workdir"' EXIT
          archive="$workdir/sing-box.tar.gz"
          bash tools/download-validation-client.sh sing-box "$archive"
          tar -xzf "$archive" -C "$workdir"
          archive="$workdir/mihomo.gz"
          bash tools/download-validation-client.sh mihomo "$archive"
          gzip -dc "$archive" > "$workdir/mihomo"
          chmod 0700 "$workdir/mihomo"
          singbox="$workdir/sing-box-1.14.4-linux-amd64/sing-box"
          mihomo="$workdir/mihomo"
          SINGBOX_TEST_BINARY="$singbox" MIHOMO_TEST_BINARY="$mihomo" npm run test:bundle
          # The pinned clients and their synthetic tunnel have no interface except loopback.
          sudo -n unshare --net -- bash -euc '
            ip link set dev lo up
            umask 077
            exec setpriv --reuid="$1" --regid="$2" --clear-groups --no-new-privs -- \
              env -i PATH=/usr/bin:/bin HOME="$3" TMPDIR="$3" WORKER_TEST_BUNDLE_DIR="$4" \
                SINGBOX_TEST_BINARY="$5" MIHOMO_TEST_BINARY="$6" "$7" --test test/vmess-h2.integration.ts
          ' -- "$(id -u)" "$(id -g)" "$workdir" "$WORKER_TEST_BUNDLE_DIR" "$singbox" "$mihomo" "$(command -v node)"
      - name: Compare legacy links and restored temporary exports offline
        env:
          WORKER_TEST_BUNDLE_DIR: ${{ runner.temp }}/subs-bot-worker
        run: |
          workdir="$(mktemp -d)"
          trap 'rm -rf -- "$workdir"' EXIT
          python3 -m venv "$workdir/venv"
          "$workdir/venv/bin/python" -m pip install --disable-pip-version-check -r ../requirements.txt 'yarl==1.20.0'
          offline_python() {
            sudo -n unshare --net -- bash -euc '
              ip link set dev lo up
              umask 077
              ulimit -c 0
              exec setpriv --reuid="$1" --regid="$2" --clear-groups --no-new-privs -- \
                env -i PATH="$4:/usr/bin:/bin" HOME="$3" TMPDIR="$3" "${@:5}"
            ' -- "$(id -u)" "$(id -g)" "$workdir" "$(dirname "$(command -v node)")" "$@"
          }
          offline_python WORKER_TEST_BUNDLE_DIR="$WORKER_TEST_BUNDLE_DIR" WORKER_TEST_REVISION="$BUILD_REVISION" \
            "$workdir/venv/bin/python" -B test/legacy-short-redirect-oracle.integration.py
          offline_python WORKER_TEST_BUNDLE_DIR="$WORKER_TEST_BUNDLE_DIR" WORKER_TEST_REVISION="$BUILD_REVISION" \
            "$workdir/venv/bin/python" -B test/legacy-temp-worker-oracle.integration.py
          offline_python WORKER_TEST_BUNDLE_DIR="$WORKER_TEST_BUNDLE_DIR" WORKER_TEST_REVISION="$BUILD_REVISION" \
            SUBS_BOT_LEGACY_PYTHON="$workdir/venv/bin/python" "$(command -v node)" --test test/legacy-dynamic-all.integration.ts
          offline_python WORKER_TEST_BUNDLE_DIR="$WORKER_TEST_BUNDLE_DIR" WORKER_TEST_REVISION="$BUILD_REVISION" \
            SUBS_BOT_LEGACY_PYTHON="$workdir/venv/bin/python" "$(command -v node)" --test test/telegram-general-auth-replay.integration.ts
          if [[ "$GITHUB_REPOSITORY" == 'jacklilyhello/subs-bot' && "$GITHUB_REF" == 'refs/heads/main' &&
                ( "$GITHUB_EVENT_NAME" == 'push' || "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ) ]]; then
            test "$BUILD_REVISION" = "$GITHUB_SHA"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            offline_python WORKER_TEST_BUNDLE_DIR="$WORKER_TEST_BUNDLE_DIR" WORKER_TEST_REVISION="$BUILD_REVISION" \
              GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" \
              GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              RUNNER_TEMP="$RUNNER_TEMP" "$workdir/venv/bin/python" -B test/legacy-selected-short-oracle.integration.py \
              --output "$RUNNER_TEMP/subs-bot-legacy-selected-aggregate-candidate"
            offline_python WORKER_TEST_BUNDLE_DIR="$WORKER_TEST_BUNDLE_DIR" WORKER_TEST_REVISION="$BUILD_REVISION" \
              GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" \
              GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              RUNNER_TEMP="$RUNNER_TEMP" "$workdir/venv/bin/python" -B test/legacy-temp-candidate-oracle.integration.py \
              --output "$RUNNER_TEMP/subs-bot-legacy-temp-node-candidate"
            offline_python WORKER_TEST_BUNDLE_DIR="$WORKER_TEST_BUNDLE_DIR" WORKER_TEST_REVISION="$BUILD_REVISION" \
              GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" \
              GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              RUNNER_TEMP="$RUNNER_TEMP" "$workdir/venv/bin/python" -B test/legacy-dynamic-all-package-oracle.integration.py \
              --output "$RUNNER_TEMP/subs-bot-legacy-dynamic-all-candidate"
            offline_python WORKER_TEST_BUNDLE_DIR="$WORKER_TEST_BUNDLE_DIR" WORKER_TEST_REVISION="$BUILD_REVISION" \
              GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" \
              GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              RUNNER_TEMP="$RUNNER_TEMP" "$workdir/venv/bin/python" -B test/legacy-unified-share-oracle.integration.py \
              --output "$RUNNER_TEMP/subs-bot-legacy-unified-share-candidate"
            offline_python WORKER_TEST_BUNDLE_DIR="$WORKER_TEST_BUNDLE_DIR" WORKER_TEST_REVISION="$BUILD_REVISION" \
              GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" \
              GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              RUNNER_TEMP="$RUNNER_TEMP" "$workdir/venv/bin/python" -B test/legacy-unified-share-oracle.integration.py \
              --v11 --output "$RUNNER_TEMP/subs-bot-legacy-unified-auth-candidate"
            offline_python GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" \
              GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              RUNNER_TEMP="$RUNNER_TEMP" "$workdir/venv/bin/python" -B tools/legacy_candidate_isolation.py build synthetic-legacy-mixed-shorts
          else
            offline_python WORKER_TEST_BUNDLE_DIR="$WORKER_TEST_BUNDLE_DIR" WORKER_TEST_REVISION="$BUILD_REVISION" \
              "$workdir/venv/bin/python" -B test/legacy-selected-short-oracle.integration.py
            offline_python WORKER_TEST_BUNDLE_DIR="$WORKER_TEST_BUNDLE_DIR" WORKER_TEST_REVISION="$BUILD_REVISION" \
              "$workdir/venv/bin/python" -B test/legacy-temp-candidate-oracle.integration.py
            offline_python WORKER_TEST_BUNDLE_DIR="$WORKER_TEST_BUNDLE_DIR" WORKER_TEST_REVISION="$BUILD_REVISION" \
              "$workdir/venv/bin/python" -B test/legacy-dynamic-all-package-oracle.integration.py
            offline_python WORKER_TEST_BUNDLE_DIR="$WORKER_TEST_BUNDLE_DIR" WORKER_TEST_REVISION="$BUILD_REVISION" \
              "$workdir/venv/bin/python" -B test/legacy-unified-share-oracle.integration.py
            offline_python WORKER_TEST_BUNDLE_DIR="$WORKER_TEST_BUNDLE_DIR" WORKER_TEST_REVISION="$BUILD_REVISION" \
              "$workdir/venv/bin/python" -B test/legacy-unified-share-oracle.integration.py --v11
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: subs-bot-legacy-mixed-short-candidate-${{ env.BUILD_REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-legacy-mixed-short-candidate/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: subs-bot-legacy-selected-aggregate-candidate-${{ env.BUILD_REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-legacy-selected-aggregate-candidate/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: subs-bot-legacy-temp-node-candidate-${{ env.BUILD_REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-legacy-temp-node-candidate/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: subs-bot-legacy-dynamic-all-candidate-${{ env.BUILD_REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-legacy-dynamic-all-candidate/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: subs-bot-legacy-unified-share-candidate-${{ env.BUILD_REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-legacy-unified-share-candidate/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: subs-bot-legacy-unified-auth-candidate-${{ env.BUILD_REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-legacy-unified-auth-candidate/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subs-bot-worker-${{ env.BUILD_REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-worker/
          if-no-files-found: error
          retention-days: 7
      - name: Build the fixed synthetic legacy candidate
        if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 -B tools/legacy_candidate_isolation.py build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: subs-bot-legacy-candidate-${{ env.BUILD_REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-legacy-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Build the fixed synthetic legacy path candidate
        if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 -B tools/legacy_candidate_isolation.py build synthetic-legacy-path
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: subs-bot-legacy-path-candidate-${{ env.BUILD_REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-legacy-path-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Build the fixed synthetic legacy empty-export candidate
        if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 -B tools/legacy_candidate_isolation.py build synthetic-legacy-empty
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: subs-bot-legacy-empty-candidate-${{ env.BUILD_REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-legacy-empty-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Build the fixed synthetic legacy private-share candidate
        if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 -B tools/legacy_candidate_isolation.py build synthetic-legacy-private-shares
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: subs-bot-legacy-private-share-candidate-${{ env.BUILD_REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-legacy-private-share-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Build the fixed synthetic legacy typed-short candidate
        if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 -B tools/legacy_candidate_isolation.py build synthetic-legacy-typed-shorts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: subs-bot-legacy-typed-short-candidate-${{ env.BUILD_REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-legacy-typed-short-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Build the fixed synthetic general authorization candidate
        if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 -B tools/legacy_candidate_isolation.py build synthetic-legacy-general-auth
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: subs-bot-legacy-general-auth-candidate-${{ env.BUILD_REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-legacy-general-auth-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Check isolated Cloudflare deployment
        if: >-
          vars.SUBS_BOT_ISOLATION_REVISION == env.BUILD_REVISION &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: node tools/isolation-smoke.mjs "$RUNNER_TEMP/subs-bot-worker/isolation.json"
