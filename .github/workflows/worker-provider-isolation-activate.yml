name: Activate private provider isolation
run-name: Provider isolation ${{ inputs.operation }} for ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      provider_ci_run_id:
        description: Successful Provider Fetch CI run for this exact main revision
        required: true
        type: string
      operation:
        description: Verify read-only or perform exactly one pinned provider operation
        required: true
        type: choice
        options:
          - verify
          - activate
          - provision-container
          - provision-workflow
          - smoke
        default: verify
      isolated_revision:
        description: Exact isolated subscription Worker health revision for smoke or its verification
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: subs-bot-provider-isolation
  cancel-in-progress: false

jobs:
  activate:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main'
    environment: subs-bot-provider-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the immutable main-branch Provider Fetch CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_PROVIDER_CI_RUN_ID: ${{ inputs.provider_ci_run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          python3 -B worker/tools/prepare_provider_artifact.py > "$RUNNER_TEMP/provider-provenance.json"
      - name: Verify or perform one private provider operation
        id: provider-activation
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_PROVIDER_CI_RUN_ID: ${{ inputs.provider_ci_run_id }}
          SUBS_BOT_PROVIDER_ACTIVATION_OPERATION: ${{ inputs.operation }}
          SUBS_BOT_PROVIDER_ISOLATED_REVISION: ${{ inputs.isolated_revision }}
          SUBS_BOT_CF_PROVIDER_ACCOUNT_ID: ${{ vars.SUBS_BOT_CF_PROVIDER_ACCOUNT_ID }}
          SUBS_BOT_CF_PROVIDER_WORKER_IDENTITY_JSON: ${{ secrets.SUBS_BOT_CF_PROVIDER_WORKER_IDENTITY_JSON }}
          SUBS_BOT_CF_PROVIDER_RELEASE_JSON: ${{ secrets.SUBS_BOT_CF_PROVIDER_RELEASE_JSON }}
          SUBS_BOT_CF_PROVIDER_ACTIVATION_JSON: ${{ secrets.SUBS_BOT_CF_PROVIDER_ACTIVATION_JSON }}
          SUBS_BOT_CF_PROVIDER_CONTAINER_IDENTITY_JSON: ${{ secrets.SUBS_BOT_CF_PROVIDER_CONTAINER_IDENTITY_JSON }}
          SUBS_BOT_CF_PROVIDER_WORKFLOW_IDENTITY_JSON: ${{ secrets.SUBS_BOT_CF_PROVIDER_WORKFLOW_IDENTITY_JSON }}
          SUBS_BOT_CF_PROVIDER_WORKER_TOKEN: ${{ secrets.SUBS_BOT_CF_PROVIDER_WORKER_TOKEN }}
          SUBS_BOT_CF_PROVIDER_CONTAINER_TOKEN: ${{ secrets.SUBS_BOT_CF_PROVIDER_CONTAINER_TOKEN }}
        run: |
          umask 077
          python3 -B worker/tools/activate_provider_isolation.py
      - name: Upload the completed private provider binding proof
        if: steps.provider-activation.outputs.binding_proof == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subs-bot-provider-binding-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-binding-proof.json
          if-no-files-found: error
          retention-days: 30
