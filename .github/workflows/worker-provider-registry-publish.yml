name: Publish isolated provider OCI image

on:
  workflow_dispatch:
    inputs:
      provider_ci_run_id:
        description: Successful Provider Fetch CI run for this exact main revision
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: subs-bot-provider-isolation
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main'
    environment: subs-bot-provider-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Skopeo from signed Ubuntu repositories
        run: |
          test "$(dpkg --print-architecture)" = amd64
          package_version=1.13.3+ds1-2ubuntu0.24.04.3
          sudo apt-get update
          sudo apt-get install --yes --reinstall --no-install-recommends "skopeo=$package_version"
          test "$(dpkg-query -W -f='${Version}' skopeo)" = "$package_version"
      - name: Verify exact main-branch Provider Fetch CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_PROVIDER_CI_RUN_ID: ${{ inputs.provider_ci_run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          python3 -B worker/tools/prepare_provider_artifact.py > "$RUNNER_TEMP/provider-provenance.json"
      - name: Publish and verify the isolated registry digest
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_PROVIDER_CI_RUN_ID: ${{ inputs.provider_ci_run_id }}
          SUBS_BOT_CF_PROVIDER_ACCOUNT_ID: ${{ vars.SUBS_BOT_CF_PROVIDER_ACCOUNT_ID }}
          SUBS_BOT_CF_PROVIDER_CONTAINER_TOKEN: ${{ secrets.SUBS_BOT_CF_PROVIDER_CONTAINER_TOKEN }}
        run: |
          umask 077
          python3 -B worker/tools/publish_provider_registry.py
