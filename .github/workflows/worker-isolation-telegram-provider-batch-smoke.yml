name: Verify isolated Telegram provider batches

on:
  workflow_dispatch:
    inputs:
      action:
        description: Seal the imported fixtures or verify both completed browser batches
        required: true
        type: choice
        options: [preflight, capture]
      cohort:
        description: Positive document cohort (16 lowercase hexadecimal characters)
        required: true
        type: string
      positive_document_run_id:
        description: Successful positive node-pages capture-created run (preflight only)
        type: string
      negative_document_run_id:
        description: Successful negative node-pages retire run (preflight only)
        type: string
      source_run_id:
        description: Successful batch preflight run (capture only)
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: subs-bot-isolation-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main'
    environment: subs-bot-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read exact private batch receipts and snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/telegram_provider_batch_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subs-bot-telegram-provider-batch-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/telegram-provider-batch-checkpoint.json
          if-no-files-found: error
          retention-days: 7
