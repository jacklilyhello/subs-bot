name: Coordinate explicitly approved production backup checkpoints
run-name: Production backup coordinator ${{ github.event_name == 'schedule' && (github.event.schedule == '*/15 * * * *' && 'scheduled-run' || 'inspect') || inputs.action }} at ${{ github.sha }}

on:
  schedule:
    - cron: '37 1 * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: One independently approved coordinator operation
        required: true
        type: choice
        options: [inspect, plan-controller-review, plan-initialize, initialize, plan-schedule-anchor, initialize-schedule-anchor, plan-resume-scheduled, resume-scheduled, plan-run, run, plan-resume, resume, plan-reconcile, reconcile, plan-abort, abort]
      session:
        description: Original coordinator plan run ID for continuation
        type: string
      sequence:
        description: Exact unresolved dispatch sequence for reconciliation
        type: string
      approval_sha256:
        description: Exact reviewed coordinator plan digest
        type: string
      source_checkpoint_id:
        description: Independently verified active source checkpoint
        type: string
      source_manifest_sha256:
        description: Independently recorded source manifest digest
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.event_name == 'schedule' && github.event.schedule == '37 1 * * *' && 'subs-bot-production-backup-coordinator-monitor' || 'subs-bot-production-backup-coordinator' }}
  cancel-in-progress: false

jobs:
  coordinate:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && ((github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *' && vars.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_DISPATCH_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.action == 'run' || inputs.action == 'resume' || inputs.action == 'resume-scheduled')))
    permissions:
      actions: write
      contents: read
    environment: subs-bot-production-backup-coordinator
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    outputs:
      scheduled_status: ${{ steps.coordinate.outputs.scheduled_status }}
      scheduled_day: ${{ steps.coordinate.outputs.scheduled_day }}
    steps:
      - name: Check scheduled authority switch
        id: gate
        env:
          SCHEDULE_ENABLED: ${{ vars.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_ENABLED }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$SCHEDULE_ENABLED" != true ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Scheduled production backups are disabled; no backup was started.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check out trusted current main
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify scheduled dispatcher identity
        if: steps.gate.outputs.enabled == 'true'
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && test "$GITHUB_RUN_ATTEMPT" = 1
      - name: Coordinate one explicitly approved operation
        id: coordinate
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CONTROL_ENVIRONMENT: subs-bot-production-backup-coordinator
          SUBS_BOT_PRODUCTION_BACKUP_COORDINATOR_ENABLED: ${{ vars.SUBS_BOT_PRODUCTION_BACKUP_COORDINATOR_ENABLED }}
          SUBS_BOT_TARGET_JSON: ${{ secrets.SUBS_BOT_TARGET_JSON }}
          SUBS_BOT_BACKUP_POLICY_JSON: ${{ secrets.SUBS_BOT_BACKUP_POLICY_JSON }}
          SUBS_BOT_BACKUP_COORDINATOR_GENESIS_SHA256: ${{ secrets.SUBS_BOT_BACKUP_COORDINATOR_GENESIS_SHA256 }}
          SUBS_BOT_BACKUP_SCHEDULE_SCOPE_GENESIS_SHA256: ${{ secrets.SUBS_BOT_BACKUP_SCHEDULE_SCOPE_GENESIS_SHA256 }}
          SUBS_BOT_BACKUP_GENESIS_SHA256: ${{ secrets.SUBS_BOT_BACKUP_GENESIS_SHA256 }}
          SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_REVIEW_JSON: ${{ secrets.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_REVIEW_JSON }}
          SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_REVIEW_SHA256: ${{ secrets.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_REVIEW_SHA256 }}
          SUBS_BOT_BACKUP_READER_LOG_POLICY_JSON: ${{ secrets.SUBS_BOT_BACKUP_READER_LOG_POLICY_JSON }}
          SUBS_BOT_BACKUP_READER_LOG_POLICY_SHA256: ${{ secrets.SUBS_BOT_BACKUP_READER_LOG_POLICY_SHA256 }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_CF_BACKUP_MONITOR_READ_TOKEN: ${{ github.event_name == 'schedule' && secrets.SUBS_BOT_CF_BACKUP_MONITOR_READ_TOKEN || '' }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_SCOPED_R2_WRITE_JSON: ${{ (github.event_name == 'schedule' || inputs.action == 'run' || inputs.action == 'resume' || inputs.action == 'resume-scheduled') && secrets.SUBS_BOT_SCOPED_R2_WRITE_JSON || '' }}
          SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_ENABLED: ${{ vars.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_ENABLED }}
          SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_AUTHORITY_JSON: ${{ (github.event_name == 'schedule' || inputs.action == 'resume-scheduled') && secrets.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_AUTHORITY_JSON || '' }}
          SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_AUTHORITY_SHA256: ${{ (github.event_name == 'schedule' || inputs.action == 'resume-scheduled') && secrets.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_AUTHORITY_SHA256 || '' }}
          BACKUP_COORDINATOR_ACTION: ${{ github.event_name == 'schedule' && 'scheduled-run' || inputs.action }}
          BACKUP_COORDINATOR_SESSION: ${{ inputs.session }}
          BACKUP_COORDINATOR_SEQUENCE: ${{ inputs.sequence }}
          BACKUP_COORDINATOR_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
          BACKUP_SOURCE_CHECKPOINT_ID: ${{ inputs.source_checkpoint_id || vars.SUBS_BOT_PRODUCTION_BACKUP_SOURCE_CHECKPOINT_ID }}
          BACKUP_SOURCE_MANIFEST_SHA256: ${{ inputs.source_manifest_sha256 || vars.SUBS_BOT_PRODUCTION_BACKUP_SOURCE_MANIFEST_SHA256 }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          python3 -B worker/tools/production_backup_coordinator.py
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$BACKUP_COORDINATOR_ACTION" = resume-scheduled ]; then
            python3 -c 'import json, os, pathlib, re; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"production-backup-coordinator-result.json"; r=json.loads(p.read_text()); s=r.get("status"); assert s in {"completed", "not-due"}; d=r.get("slotDay", ""); assert s != "completed" or re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", d); open(os.environ["GITHUB_OUTPUT"], "a").write("scheduled_status=" + s + "\n" + ("scheduled_day=" + d + "\n" if s == "completed" else ""))'
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-backup-coordinator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-backup-coordinator-result.json
          if-no-files-found: warn
          retention-days: 7
  schedule_readback:
    needs: coordinate
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.action == 'resume-scheduled') && needs.coordinate.result == 'success' && needs.coordinate.outputs.scheduled_status == 'completed'
    permissions:
      actions: read
      contents: read
    environment: subs-bot-production-backup-coordinator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Independently verify completed scheduled backup
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CONTROL_ENVIRONMENT: subs-bot-production-backup-coordinator
          SUBS_BOT_TARGET_JSON: ${{ secrets.SUBS_BOT_TARGET_JSON }}
          SUBS_BOT_BACKUP_POLICY_JSON: ${{ secrets.SUBS_BOT_BACKUP_POLICY_JSON }}
          SUBS_BOT_BACKUP_GENESIS_SHA256: ${{ secrets.SUBS_BOT_BACKUP_GENESIS_SHA256 }}
          SUBS_BOT_BACKUP_COORDINATOR_GENESIS_SHA256: ${{ secrets.SUBS_BOT_BACKUP_COORDINATOR_GENESIS_SHA256 }}
          SUBS_BOT_BACKUP_SCHEDULE_SCOPE_GENESIS_SHA256: ${{ secrets.SUBS_BOT_BACKUP_SCHEDULE_SCOPE_GENESIS_SHA256 }}
          SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_AUTHORITY_JSON: ${{ secrets.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_AUTHORITY_JSON }}
          SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_AUTHORITY_SHA256: ${{ secrets.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_AUTHORITY_SHA256 }}
          SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_REVIEW_JSON: ${{ secrets.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_REVIEW_JSON }}
          SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_REVIEW_SHA256: ${{ secrets.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_REVIEW_SHA256 }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_SCOPED_R2_WRITE_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_WRITE_JSON }}
          SCHEDULE_SLOT_DAY: ${{ needs.coordinate.outputs.scheduled_day }}
          SCHEDULE_READBACK_MODE: fresh
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          python3 -B worker/tools/production_backup_schedule_readback.py
  inspect_or_reconcile:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.action != 'run' && inputs.action != 'resume' && inputs.action != 'resume-scheduled'
    environment: subs-bot-production-backup-coordinator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Inspect or reconcile without workflow dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CONTROL_ENVIRONMENT: subs-bot-production-backup-coordinator
          SUBS_BOT_PRODUCTION_BACKUP_COORDINATOR_ENABLED: ${{ vars.SUBS_BOT_PRODUCTION_BACKUP_COORDINATOR_ENABLED }}
          SUBS_BOT_TARGET_JSON: ${{ secrets.SUBS_BOT_TARGET_JSON }}
          SUBS_BOT_BACKUP_POLICY_JSON: ${{ secrets.SUBS_BOT_BACKUP_POLICY_JSON }}
          SUBS_BOT_BACKUP_COORDINATOR_GENESIS_SHA256: ${{ secrets.SUBS_BOT_BACKUP_COORDINATOR_GENESIS_SHA256 }}
          SUBS_BOT_BACKUP_GENESIS_SHA256: ${{ secrets.SUBS_BOT_BACKUP_GENESIS_SHA256 }}
          SUBS_BOT_BACKUP_SCHEDULE_SCOPE_GENESIS_SHA256: ${{ secrets.SUBS_BOT_BACKUP_SCHEDULE_SCOPE_GENESIS_SHA256 }}
          SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_REVIEW_JSON: ${{ (inputs.action == 'initialize' || inputs.action == 'reconcile' || inputs.action == 'abort') && secrets.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_REVIEW_JSON || '' }}
          SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_REVIEW_SHA256: ${{ (inputs.action == 'initialize' || inputs.action == 'reconcile' || inputs.action == 'abort') && secrets.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_REVIEW_SHA256 || '' }}
          SUBS_BOT_BACKUP_READER_LOG_POLICY_JSON: ${{ (inputs.action == 'initialize' || inputs.action == 'reconcile' || inputs.action == 'abort') && secrets.SUBS_BOT_BACKUP_READER_LOG_POLICY_JSON || '' }}
          SUBS_BOT_BACKUP_READER_LOG_POLICY_SHA256: ${{ (inputs.action == 'initialize' || inputs.action == 'reconcile' || inputs.action == 'abort') && secrets.SUBS_BOT_BACKUP_READER_LOG_POLICY_SHA256 || '' }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_SCOPED_R2_EXTRA_READ_JSON: ${{ (inputs.action == 'plan-schedule-anchor' || inputs.action == 'initialize-schedule-anchor') && secrets.SUBS_BOT_SCOPED_R2_EXTRA_READ_JSON || '' }}
          SUBS_BOT_CF_BACKUP_MONITOR_READ_TOKEN: ${{ (inputs.action == 'plan-schedule-anchor' || inputs.action == 'initialize-schedule-anchor') && secrets.SUBS_BOT_CF_BACKUP_MONITOR_READ_TOKEN || '' }}
          SUBS_BOT_CF_WORKER_READ_TOKEN: ${{ (inputs.action == 'plan-schedule-anchor' || inputs.action == 'initialize-schedule-anchor') && secrets.SUBS_BOT_CF_WORKER_READ_TOKEN || '' }}
          SUBS_BOT_PROVISION_ANCHOR_JSON: ${{ (inputs.action == 'plan-schedule-anchor' || inputs.action == 'initialize-schedule-anchor') && secrets.SUBS_BOT_PROVISION_ANCHOR_JSON || '' }}
          SUBS_BOT_BACKUP_SCOPE_BOOTSTRAP_REVIEW_JSON: ${{ (inputs.action == 'plan-schedule-anchor' || inputs.action == 'initialize-schedule-anchor') && secrets.SUBS_BOT_BACKUP_SCOPE_BOOTSTRAP_REVIEW_JSON || '' }}
          SUBS_BOT_BACKUP_SCOPE_BOOTSTRAP_REVIEW_SHA256: ${{ (inputs.action == 'plan-schedule-anchor' || inputs.action == 'initialize-schedule-anchor') && secrets.SUBS_BOT_BACKUP_SCOPE_BOOTSTRAP_REVIEW_SHA256 || '' }}
          SUBS_BOT_BACKUP_SCOPE_BOOTSTRAP_REGISTRATION_SHA256: ${{ (inputs.action == 'plan-schedule-anchor' || inputs.action == 'initialize-schedule-anchor') && secrets.SUBS_BOT_BACKUP_SCOPE_BOOTSTRAP_REGISTRATION_SHA256 || '' }}
          SUBS_BOT_BACKUP_SCOPE_BOOTSTRAP_PLAN_SHA256: ${{ inputs.action == 'initialize-schedule-anchor' && secrets.SUBS_BOT_BACKUP_SCOPE_BOOTSTRAP_PLAN_SHA256 || '' }}
          SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_ENABLED: ${{ vars.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_ENABLED }}
          SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_AUTHORITY_JSON: ${{ inputs.action == 'plan-resume-scheduled' && secrets.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_AUTHORITY_JSON || '' }}
          SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_AUTHORITY_SHA256: ${{ inputs.action == 'plan-resume-scheduled' && secrets.SUBS_BOT_PRODUCTION_BACKUP_SCHEDULE_AUTHORITY_SHA256 || '' }}
          SUBS_BOT_SCOPED_R2_WRITE_JSON: ${{ (inputs.action == 'initialize' || inputs.action == 'initialize-schedule-anchor' || inputs.action == 'reconcile' || inputs.action == 'abort') && secrets.SUBS_BOT_SCOPED_R2_WRITE_JSON || '' }}
          BACKUP_COORDINATOR_ACTION: ${{ inputs.action }}
          BACKUP_COORDINATOR_SESSION: ${{ inputs.session }}
          BACKUP_COORDINATOR_SEQUENCE: ${{ inputs.sequence }}
          BACKUP_COORDINATOR_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
          BACKUP_SOURCE_CHECKPOINT_ID: ${{ inputs.source_checkpoint_id || vars.SUBS_BOT_PRODUCTION_BACKUP_SOURCE_CHECKPOINT_ID }}
          BACKUP_SOURCE_MANIFEST_SHA256: ${{ inputs.source_manifest_sha256 || vars.SUBS_BOT_PRODUCTION_BACKUP_SOURCE_MANIFEST_SHA256 }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          python3 -B worker/tools/production_backup_coordinator.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-backup-coordinator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-backup-coordinator-result.json
          if-no-files-found: warn
          retention-days: 7
  monitor:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name == 'schedule' && github.event.schedule == '37 1 * * *' && vars.SUBS_BOT_PRODUCTION_BACKUP_MONITOR_DISPATCH_ENABLED == 'true'
    environment: subs-bot-production-backup-coordinator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      status: ${{ steps.gate.outputs.status }}
    steps:
      - name: Check whether coordinator monitoring is enabled
        id: gate
        env:
          MONITOR_ENABLED: ${{ vars.SUBS_BOT_PRODUCTION_BACKUP_COORDINATOR_MONITOR_ENABLED }}
        run: |
          if [ "$MONITOR_ENABLED" = true ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'status=enabled' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'status=disabled' >> "$GITHUB_OUTPUT"
            echo '::warning::Coordinator monitoring is disabled; no observation was made.'
            echo 'Coordinator monitoring is disabled; no observation was made.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect without dispatch or object writes
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CONTROL_ENVIRONMENT: subs-bot-production-backup-coordinator
          SUBS_BOT_TARGET_JSON: ${{ secrets.SUBS_BOT_TARGET_JSON }}
          SUBS_BOT_BACKUP_POLICY_JSON: ${{ secrets.SUBS_BOT_BACKUP_POLICY_JSON }}
          SUBS_BOT_BACKUP_COORDINATOR_GENESIS_SHA256: ${{ secrets.SUBS_BOT_BACKUP_COORDINATOR_GENESIS_SHA256 }}
          SUBS_BOT_BACKUP_SCHEDULE_SCOPE_GENESIS_SHA256: ${{ secrets.SUBS_BOT_BACKUP_SCHEDULE_SCOPE_GENESIS_SHA256 }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          BACKUP_COORDINATOR_ACTION: inspect
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          python3 -B worker/tools/production_backup_coordinator.py
