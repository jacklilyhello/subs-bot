name: Stage Telegram acceptance fixtures

on:
  workflow_dispatch:
    inputs:
      action:
        description: Seed or retire one cohort, or verify bulk trash
        required: true
        type: choice
        options: [seed, verify, retire]
      cohort:
        description: Unique 16-character lowercase alphanumeric cohort key
        required: true
        type: string
      purpose:
        description: Read-only views, subscription lifecycle, or private bulk trash
        required: true
        type: choice
        options: [views, lifecycle, bulk-trash]
        default: views
      source_run_id:
        description: Successful bulk-trash seed or verify run ID
        required: false
        type: string
      source_revision:
        description: Full source commit SHA for bulk-trash retirement
        required: false
        type: string
      confirm_retire:
        description: Enter retire followed by the bulk-trash cohort key
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: subs-bot-isolation-deploy
  cancel-in-progress: false

jobs:
  fixtures:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main'
    environment: subs-bot-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify and manage only the isolated synthetic cohort
        if: inputs.purpose != 'bulk-trash'
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_TELEGRAM_FIXTURE_ACTION: ${{ inputs.action }}
          SUBS_BOT_TELEGRAM_FIXTURE_COHORT: ${{ inputs.cohort }}
          SUBS_BOT_TELEGRAM_FIXTURE_PURPOSE: ${{ inputs.purpose }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/telegram_view_fixtures.py
      - name: Checkpoint only the isolated bulk-trash cohort
        if: inputs.purpose == 'bulk-trash'
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_TELEGRAM_AGGREGATE_KEY: ${{ secrets.SUBS_BOT_TELEGRAM_AGGREGATE_KEY }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/telegram_bulk_trash_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.purpose == 'bulk-trash'
        with:
          name: subs-bot-telegram-bulk-trash-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/telegram-bulk-trash-checkpoint.json
          if-no-files-found: error
          retention-days: 7
