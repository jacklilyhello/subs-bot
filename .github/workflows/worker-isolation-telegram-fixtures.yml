name: Stage Telegram acceptance fixtures

on:
  workflow_dispatch:
    inputs:
      action:
        description: Seed or retire one synthetic fixture cohort
        required: true
        type: choice
        options: [seed, retire]
      cohort:
        description: Unique 16-character lowercase alphanumeric cohort key
        required: true
        type: string
      purpose:
        description: Read-only views or subscription lifecycle actions
        required: true
        type: choice
        options: [views, lifecycle]
        default: views

permissions:
  contents: read

concurrency:
  group: subs-bot-isolation-deploy
  cancel-in-progress: false

jobs:
  fixtures:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main'
    environment: subs-bot-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify and manage only the isolated synthetic cohort
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_TELEGRAM_FIXTURE_ACTION: ${{ inputs.action }}
          SUBS_BOT_TELEGRAM_FIXTURE_COHORT: ${{ inputs.cohort }}
          SUBS_BOT_TELEGRAM_FIXTURE_PURPOSE: ${{ inputs.purpose }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/telegram_view_fixtures.py
