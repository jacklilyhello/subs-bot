name: Coordinate reviewed isolated backup
run-name: Rehearsal backup coordinator ${{ inputs.action }} at ${{ github.sha }} candidate ${{ fromJSON(inputs.validation_json).headSha }}

on:
  workflow_dispatch:
    inputs:
      validation_json:
        description: Canonical pinned isolated source and reviewed candidate
        required: true
        type: string
      action:
        description: Fixed coordinator action
        required: true
        type: string
      coordinator_session:
        type: string
      coordinator_sequence:
        type: string
      approval_sha256:
        type: string
      source_checkpoint_id:
        required: true
        type: string
      source_manifest_sha256:
        required: true
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: subs-bot-lifecycle-rehearsal
  cancel-in-progress: false

jobs:
  coordinate:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: subs-bot-backup-head-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      snapshot_sha256: ${{ steps.snapshot_pin.outputs.snapshot_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      BACKUP_HEAD_ENVIRONMENT: subs-bot-backup-head-isolation
      BACKUP_GATE_ROLE: parent
      SUBS_BOT_CONTROL_ENVIRONMENT: subs-bot-isolation
      SUBS_BOT_BACKUP_PHASE_REHEARSAL_ENABLED: ${{ vars.SUBS_BOT_BACKUP_PHASE_REHEARSAL_ENABLED }}
      SUBS_BOT_BACKUP_PHASE_REHEARSAL_WRITES_ENABLED: ${{ vars.SUBS_BOT_BACKUP_PHASE_REHEARSAL_WRITES_ENABLED }}
      BACKUP_REVIEWED_HEAD_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
      BACKUP_PHASE_REGISTRATION_SHA256: ${{ vars.SUBS_BOT_BACKUP_PHASE_REGISTRATION_SHA256 }}
      BACKUP_PHASE_SOURCE_CHECKPOINT_ID: ${{ vars.SUBS_BOT_BACKUP_PHASE_SOURCE_CHECKPOINT_ID }}
      BACKUP_PHASE_SOURCE_MANIFEST_SHA256: ${{ vars.SUBS_BOT_BACKUP_PHASE_SOURCE_MANIFEST_SHA256 }}
      BACKUP_PHASE_GENESIS_SHA256: ${{ vars.SUBS_BOT_BACKUP_PHASE_GENESIS_SHA256 }}
      BACKUP_PHASE_CHECKPOINT_ID: ${{ vars.SUBS_BOT_BACKUP_PHASE_CHECKPOINT_ID }}
      HEAD_VALIDATION_JSON: ${{ inputs.validation_json }}
      BACKUP_ACTION: ${{ inputs.action }}
      BACKUP_COORDINATOR_SESSION: ${{ inputs.coordinator_session }}
      BACKUP_COORDINATOR_SEQUENCE: ${{ inputs.coordinator_sequence }}
      BACKUP_COORDINATOR_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
      BACKUP_SOURCE_CHECKPOINT_ID: ${{ inputs.source_checkpoint_id }}
      BACKUP_SOURCE_MANIFEST_SHA256: ${{ inputs.source_manifest_sha256 }}
      SUBS_BOT_BACKUP_COORDINATOR_GENESIS_SHA256: ${{ vars.SUBS_BOT_BACKUP_COORDINATOR_GENESIS_SHA256 }}
      SUBS_BOT_PHASE_WEBHOOK_ANCHOR_GENESIS_SHA256: ${{ vars.SUBS_BOT_PHASE_WEBHOOK_ANCHOR_GENESIS_SHA256 }}
      SUBS_BOT_PHASE_WEBHOOK_HISTORY_SHA256: ${{ vars.SUBS_BOT_PHASE_WEBHOOK_HISTORY_SHA256 }}
      SUBS_BOT_PHASE_WEBHOOK_CONTROLLERS_JSON: ${{ vars.SUBS_BOT_PHASE_WEBHOOK_CONTROLLERS_JSON }}
      SUBS_BOT_PHASE_WEBHOOK_CANDIDATES_JSON: ${{ vars.SUBS_BOT_PHASE_WEBHOOK_CANDIDATES_JSON }}
      SUBS_BOT_PHASE_WEBHOOK_BOUNDARY_JSON: ${{ vars.SUBS_BOT_PHASE_WEBHOOK_BOUNDARY_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Verify trusted coordinator identity before candidate checkout
        env:
          BACKUP_CHECKOUT_PHASE: before
        run: python3 -B trusted/worker/tools/trusted_backup_phase_gate.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(inputs.validation_json).headSha }}
          path: candidate
          persist-credentials: false
      - name: Verify exact reviewed coordinator checkout
        env:
          BACKUP_CHECKOUT_PHASE: ready
        run: python3 -B trusted/worker/tools/trusted_backup_phase_gate.py
      - name: Verify isolated coordinator test Bot identity
        env:
          BACKUP_CHECKOUT_PHASE: credential-check
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: python3 -B trusted/worker/tools/trusted_backup_phase_gate.py
      - name: Coordinate reviewed isolated backup phases
        env:
          HEAD_TRUSTED_MAIN_SHA: ${{ github.sha }}
          HEAD_TRUSTED_REVIEWED_SHA: ${{ fromJSON(inputs.validation_json).headSha }}
          HEAD_TRUSTED_WEBHOOK_CLEANUP: ${{ inputs.action == 'run' && 'configured-v1' || '' }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ (inputs.action == 'run' && secrets.SUBS_BOT_CF_REHEARSAL_DATA_TOKEN) || (inputs.action != 'run' && secrets.SUBS_BOT_CF_REHEARSAL_DATA_READ_TOKEN) || '' }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_WORKER_READ_TOKEN }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_SCOPED_R2_WRITE_JSON: ${{ contains(fromJSON('["initialize","initialize-webhook-anchor","run","resume","reconcile","abort"]'), inputs.action) && secrets.SUBS_BOT_SCOPED_R2_WRITE_JSON || '' }}
          SUBS_BOT_BACKUP_POLICY_JSON: ${{ secrets.SUBS_BOT_BACKUP_POLICY_JSON }}
          PYTHONPATH: ${{ github.workspace }}/trusted/worker/tools
        run: |
          umask 077
          python3 -B candidate/worker/tools/production_backup_rehearsal_coordinator.py
      - name: Forward the private snapshot digest for independent inspection
        id: snapshot_pin
        if: always() && inputs.action == 'run'
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, re
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'backup-webhook-snapshot-pin.json'
          if p.is_file() and not p.is_symlink():
              value = json.loads(p.read_text())
              pin = value.get('snapshotSha256', '')
              if value.get('runId') == os.environ['GITHUB_RUN_ID'] and value.get('runAttempt') == '1' and re.fullmatch(r'[a-f0-9]{64}', pin):
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
                      output.write('snapshot_sha256=' + pin + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: subs-bot-rehearsal-backup-coordinator-${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal-backup-coordinator-result.json
          if-no-files-found: warn
          retention-days: 7
  trusted_cleanup:
    needs: [coordinate]
    if: always() && github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.action == 'run'
    environment: subs-bot-backup-head-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      WEBHOOK_SOURCE_KIND: phase-coordinator
      WEBHOOK_SOURCE_RUN_ID: ${{ github.run_id }}
      WEBHOOK_SOURCE_ATTEMPT: ${{ github.run_attempt }}
      WEBHOOK_SOURCE_MAIN_SHA: ${{ github.sha }}
      WEBHOOK_SOURCE_CANDIDATE_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
      WEBHOOK_REVIEWED_CANDIDATE_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
      WEBHOOK_REGISTRATION_SHA256: ${{ vars.SUBS_BOT_BACKUP_PHASE_REGISTRATION_SHA256 }}
      WEBHOOK_SNAPSHOT_SHA256: ${{ needs.coordinate.outputs.snapshot_sha256 }}
      BACKUP_SOURCE_CHECKPOINT_ID: ${{ vars.SUBS_BOT_BACKUP_PHASE_SOURCE_CHECKPOINT_ID }}
      BACKUP_SOURCE_MANIFEST_SHA256: ${{ vars.SUBS_BOT_BACKUP_PHASE_SOURCE_MANIFEST_SHA256 }}
      BACKUP_GENESIS_SHA256: ${{ vars.SUBS_BOT_BACKUP_PHASE_GENESIS_SHA256 }}
      SUBS_BOT_BACKUP_COORDINATOR_GENESIS_SHA256: ${{ vars.SUBS_BOT_BACKUP_COORDINATOR_GENESIS_SHA256 }}
      SUBS_BOT_PHASE_WEBHOOK_ANCHOR_GENESIS_SHA256: ${{ vars.SUBS_BOT_PHASE_WEBHOOK_ANCHOR_GENESIS_SHA256 }}
      HEAD_VALIDATION_JSON: ${{ inputs.validation_json }}
    steps:
      - name: Check out trusted current main on a fresh runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Confirm trusted main checkout
        run: test "$(git -C trusted rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Trusted inspect original webhook snapshot
        id: webhook_snapshot
        env:
          WEBHOOK_RECOVERY_ACTION: inspect
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_DATA_READ_TOKEN }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: python3 -B trusted/worker/tools/production_backup_webhook_recovery.py
      - name: Trusted close and freeze isolated admission
        id: admission_cleanup
        if: always() && steps.webhook_snapshot.outcome == 'success'
        env:
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_SCOPED_R2_WRITE_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_WRITE_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_DATA_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_WORKER_READ_TOKEN }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_BACKUP_POLICY_JSON: ${{ secrets.SUBS_BOT_BACKUP_POLICY_JSON }}
        run: python3 -B trusted/worker/tools/production_backup_admission_recovery.py
      - name: Trusted restore original test webhook
        id: webhook_restore
        if: always() && steps.webhook_snapshot.outcome == 'success' && steps.admission_cleanup.outcome == 'success'
        env:
          WEBHOOK_RECOVERY_ACTION: restore
          WEBHOOK_FREEZE_CONFIRMATION_SHA256: ${{ steps.admission_cleanup.outputs.freeze_confirmation_sha256 }}
          WEBHOOK_SOURCE_CHECKPOINT_ID: ${{ vars.SUBS_BOT_BACKUP_PHASE_SOURCE_CHECKPOINT_ID }}
          WEBHOOK_SOURCE_MANIFEST_SHA256: ${{ vars.SUBS_BOT_BACKUP_PHASE_SOURCE_MANIFEST_SHA256 }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_SCOPED_R2_WRITE_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_WRITE_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_DATA_READ_TOKEN }}
          SUBS_BOT_CF_REHEARSAL_WORKER_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_WORKER_READ_TOKEN }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: python3 -B trusted/worker/tools/production_backup_webhook_recovery.py
      - name: Release webhook lock only after independent restoration readback
        if: always() && steps.webhook_restore.outcome == 'success'
        env:
          WEBHOOK_FREEZE_CONFIRMATION_SHA256: ${{ steps.admission_cleanup.outputs.freeze_confirmation_sha256 }}
          WEBHOOK_SOURCE_CHECKPOINT_ID: ${{ vars.SUBS_BOT_BACKUP_PHASE_SOURCE_CHECKPOINT_ID }}
          WEBHOOK_SOURCE_MANIFEST_SHA256: ${{ vars.SUBS_BOT_BACKUP_PHASE_SOURCE_MANIFEST_SHA256 }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_SCOPED_R2_WRITE_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_WRITE_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_DATA_READ_TOKEN }}
          SUBS_BOT_CF_REHEARSAL_WORKER_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_WORKER_READ_TOKEN }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: python3 -B trusted/worker/tools/trusted_backup_webhook_anchor.py
