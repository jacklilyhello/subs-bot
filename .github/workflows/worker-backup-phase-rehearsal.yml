name: Execute one reviewed isolated backup phase
run-name: Rehearsal backup ${{ inputs.action }} at ${{ github.sha }} candidate ${{ fromJSON(inputs.validation_json).headSha }} #${{ inputs.dispatch_nonce }}

on:
  workflow_dispatch:
    inputs:
      validation_json:
        description: Exact independently pinned rehearsal target and reviewed candidate
        required: true
        type: string
      action:
        description: One fixed backup phase
        required: true
        type: string
      session:
        type: string
      session_day:
        type: string
      state_sha256:
        type: string
      source_checkpoint_id:
        required: true
        type: string
      source_manifest_sha256:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      dispatch_deadline:
        required: true
        type: string
      coordinator_session:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  phase:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: subs-bot-backup-head-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BACKUP_HEAD_ENVIRONMENT: subs-bot-backup-head-isolation
      BACKUP_GATE_ROLE: child
      SUBS_BOT_CONTROL_ENVIRONMENT: subs-bot-isolation
      SUBS_BOT_BACKUP_PHASE_REHEARSAL_ENABLED: ${{ vars.SUBS_BOT_BACKUP_PHASE_REHEARSAL_ENABLED }}
      SUBS_BOT_BACKUP_PHASE_REHEARSAL_WRITES_ENABLED: ${{ vars.SUBS_BOT_BACKUP_PHASE_REHEARSAL_WRITES_ENABLED }}
      BACKUP_REVIEWED_HEAD_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
      BACKUP_PHASE_REGISTRATION_SHA256: ${{ vars.SUBS_BOT_BACKUP_PHASE_REGISTRATION_SHA256 }}
      BACKUP_PHASE_SOURCE_CHECKPOINT_ID: ${{ vars.SUBS_BOT_BACKUP_PHASE_SOURCE_CHECKPOINT_ID }}
      BACKUP_PHASE_SOURCE_MANIFEST_SHA256: ${{ vars.SUBS_BOT_BACKUP_PHASE_SOURCE_MANIFEST_SHA256 }}
      BACKUP_PHASE_GENESIS_SHA256: ${{ vars.SUBS_BOT_BACKUP_PHASE_GENESIS_SHA256 }}
      SUBS_BOT_PHASE_WEBHOOK_ANCHOR_GENESIS_SHA256: ${{ vars.SUBS_BOT_PHASE_WEBHOOK_ANCHOR_GENESIS_SHA256 }}
      BACKUP_PHASE_CHECKPOINT_ID: ${{ vars.SUBS_BOT_BACKUP_PHASE_CHECKPOINT_ID }}
      HEAD_VALIDATION_JSON: ${{ inputs.validation_json }}
      BACKUP_ACTION: ${{ inputs.action }}
      BACKUP_SESSION: ${{ inputs.session }}
      BACKUP_SESSION_DAY: ${{ inputs.session_day }}
      BACKUP_STATE_SHA256: ${{ inputs.state_sha256 }}
      BACKUP_SOURCE_CHECKPOINT_ID: ${{ inputs.source_checkpoint_id }}
      BACKUP_SOURCE_MANIFEST_SHA256: ${{ inputs.source_manifest_sha256 }}
      BACKUP_DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
      BACKUP_DISPATCH_DEADLINE: ${{ inputs.dispatch_deadline }}
      BACKUP_COORDINATOR_SESSION: ${{ inputs.coordinator_session }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Verify trusted phase identity before candidate checkout
        env:
          BACKUP_CHECKOUT_PHASE: before
        run: python3 -B trusted/worker/tools/trusted_backup_phase_gate.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(inputs.validation_json).headSha }}
          path: candidate
          persist-credentials: false
      - name: Verify exact reviewed phase checkout
        env:
          BACKUP_CHECKOUT_PHASE: ready
        run: python3 -B trusted/worker/tools/trusted_backup_phase_gate.py
      - name: Verify isolated test Bot identity
        env:
          BACKUP_CHECKOUT_PHASE: credential-check
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: python3 -B trusted/worker/tools/trusted_backup_phase_gate.py
      - name: Execute one reviewed rehearsal phase
        env:
          HEAD_TRUSTED_MAIN_SHA: ${{ github.sha }}
          HEAD_TRUSTED_REVIEWED_SHA: ${{ fromJSON(inputs.validation_json).headSha }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ (contains(fromJSON('["plan-begin","begin","preflight","plan-pause","drain","verify","plan-activate"]'), inputs.action) && secrets.SUBS_BOT_CF_REHEARSAL_DATA_READ_TOKEN) || (!contains(fromJSON('["plan-begin","begin","preflight","plan-pause","drain","verify","plan-activate"]'), inputs.action) && secrets.SUBS_BOT_CF_REHEARSAL_DATA_TOKEN) || '' }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_WORKER_READ_TOKEN }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_SCOPED_R2_WRITE_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_WRITE_JSON }}
          SUBS_BOT_BACKUP_POLICY_JSON: ${{ secrets.SUBS_BOT_BACKUP_POLICY_JSON }}
          PYTHONPATH: ${{ github.workspace }}/trusted/worker/tools
        run: |
          umask 077
          python3 -B candidate/worker/tools/production_backup_rehearsal_phase.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: subs-bot-rehearsal-backup-${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-backup-result.json
          if-no-files-found: warn
          retention-days: 7
