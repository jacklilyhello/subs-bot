name: Verify isolated Telegram private share creation

on:
  workflow_dispatch:
    inputs:
      action:
        description: Prepare before IAB, verify its evidence, or retire the verified cohort
        required: true
        type: choice
        options: [prepare, verify, retire]
      cohort:
        description: Fresh 16-character lowercase hexadecimal cohort
        required: true
        type: string
      source_run_id:
        description: Successful prepare run for verify, or successful verify run for retire
        type: string
      observations:
        description: Verify only. JSON with codeHashes, raceWinner, groupShareMessageId and groupControlMessageId
        type: string
      confirm_verify:
        description: Verify only. Use "verify COHORT on equivalent release" to reuse an earlier preparation
        type: string
      confirm_retire:
        description: Retire only. Use "retire COHORT", or "retire COHORT on current release" for explicit release drift
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: subs-bot-isolation-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main'
    environment: subs-bot-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the isolated private share cohort
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/telegram_private_share_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subs-bot-telegram-private-share-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/telegram-private-share-checkpoint.json
          if-no-files-found: error
          retention-days: 7
