name: Deploy Worker isolation

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Worker CI run for exact main (required for release, plan, stage and activate)
        required: false
        type: string
      inline_search:
        description: Preserve, enable, or disable inline search on the isolated Worker
        required: true
        default: preserve
        type: choice
        options:
          - preserve
          - enable
          - disable
      inline_search_confirmation:
        description: Exact isolation confirmation for enable or disable
        required: false
        type: string
      provider_url_import:
        description: Preserve, enable, or disable new private Telegram provider URL imports
        required: true
        default: preserve
        type: choice
        options: [preserve, enable, disable]
      provider_url_import_confirmation:
        description: Exact isolation confirmation for provider URL import enable or disable
        required: false
        type: string
      provider_url_documents:
        description: Preserve, enable, or disable new private Telegram URL document imports
        required: true
        default: preserve
        type: choice
        options: [preserve, enable, disable]
      provider_url_documents_confirmation:
        description: Exact isolation confirmation for provider URL document enable or disable
        required: false
        type: string
      mixed_documents:
        description: Preserve, enable, or disable new private Telegram mixed document imports
        required: true
        default: preserve
        type: choice
        options: [preserve, enable, disable]
      mixed_documents_confirmation:
        description: Exact isolation confirmation for mixed document enable or disable
        required: false
        type: string
      group_share_cards:
        description: Preserve, enable, or disable new Telegram group share cards
        required: true
        default: preserve
        type: choice
        options: [preserve, enable, disable]
      group_share_cards_confirmation:
        description: Exact isolation confirmation for group share card enable or disable
        required: false
        type: string
      provider_refresh:
        description: Preserve, enable, or disable private Telegram provider refresh admission
        required: true
        default: preserve
        type: choice
        options: [preserve, enable, disable]
      provider_refresh_confirmation:
        description: Exact isolation confirmation for provider refresh enable or disable
        required: false
        type: string
      legacy_subscription_shorts:
        description: Preserve, enable, or disable isolated typed legacy subscription short links
        required: true
        default: preserve
        type: choice
        options: [preserve, enable, disable]
      legacy_subscription_shorts_confirmation:
        description: Exact isolation confirmation for legacy subscription short-link enable or disable
        required: false
        type: string
      subscription_shorts:
        description: Preserve, enable, or disable new private typed subscription short links
        required: true
        default: preserve
        type: choice
        options: [preserve, enable, disable]
      subscription_shorts_confirmation:
        description: Exact isolation confirmation for a typed subscription short-link change
        required: false
        type: string
      provider_batch:
        description: Preserve, enable, or disable new private Telegram batch refreshes
        required: true
        default: preserve
        type: choice
        options: [preserve, enable, disable]
      provider_batch_confirmation:
        description: Exact isolation confirmation for provider batch enable or disable
        required: false
        type: string
      api_status:
        description: Preserve, enable, or disable private Telegram API status admission
        required: true
        default: preserve
        type: choice
        options: [preserve, enable, disable]
      api_status_confirmation:
        description: Exact isolation confirmation for API status enable or disable
        required: false
        type: string
      page_jump:
        description: Preserve ordinary deployment, or manage the isolated page-jump release
        required: true
        default: preserve
        type: choice
        options: [preserve, plan, stage, activate, reconcile, open, pause, pause-durable, drain, rollback]
      page_jump_confirmation:
        description: Exact isolation confirmation for the page-jump operation
        required: false
        type: string
      page_jump_checkpoint:
        description: Exact plan, stage, journal or pause checkpoint for this operation
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: subs-bot-isolation-deploy
  cancel-in-progress: false

jobs:
  inspect-api-status:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && inputs.page_jump == 'preserve' && inputs.api_status == 'preserve' && inputs.api_status_confirmation == ''
    environment: subs-bot-isolation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      required: ${{ steps.inspect.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the active API status flag
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/attest_api_status_container.py inspect

  attest-api-status:
    needs: inspect-api-status
    if: >-
      ${{ !cancelled() && github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && inputs.page_jump == 'preserve' &&
          ((inputs.api_status == 'enable' && inputs.api_status_confirmation == 'enable API status for subs-bot-cf-dev-01') ||
           needs.inspect-api-status.outputs.required == 'true') }}
    environment: subs-bot-provider-api-status-isolation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      attestation: ${{ steps.attest.outputs.attestation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Attest the exact private V2 Container settings
        id: attest
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CF_PROVIDER_ACCOUNT_ID: ${{ vars.SUBS_BOT_CF_PROVIDER_ACCOUNT_ID }}
          SUBS_BOT_CF_PROVIDER_API_STATUS_ACTIVATION_JSON: ${{ secrets.SUBS_BOT_CF_PROVIDER_API_STATUS_ACTIVATION_JSON }}
          SUBS_BOT_CF_PROVIDER_API_STATUS_CONTAINER_IDENTITY_JSON: ${{ secrets.SUBS_BOT_CF_PROVIDER_API_STATUS_CONTAINER_IDENTITY_JSON }}
          SUBS_BOT_CF_PROVIDER_API_STATUS_ATTEST_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_PROVIDER_API_STATUS_ATTEST_READ_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/attest_api_status_container.py attest

  deploy:
    needs: [inspect-api-status, attest-api-status]
    if: ${{ !cancelled() && github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' }}
    environment: subs-bot-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify merged artifact provenance and digests
        if: contains(fromJSON('["preserve","plan","stage","activate"]'), inputs.page_jump)
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CI_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          worker_artifact_proof="$RUNNER_TEMP/subs-bot-isolation-artifact-proof.json"
          python3 -B worker/tools/prepare_isolation_artifact.py > "$worker_artifact_proof"
          cat "$worker_artifact_proof"
      - name: Release the verified Worker or stage page jump closed
        if: contains(fromJSON('["preserve","plan","stage"]'), inputs.page_jump)
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_INLINE_SEARCH_MODE: ${{ inputs.inline_search }}
          SUBS_BOT_INLINE_SEARCH_CONFIRMATION: ${{ inputs.inline_search_confirmation }}
          SUBS_BOT_PROVIDER_URL_IMPORT_MODE: ${{ inputs.provider_url_import }}
          SUBS_BOT_PROVIDER_URL_IMPORT_CONFIRMATION: ${{ inputs.provider_url_import_confirmation }}
          SUBS_BOT_PROVIDER_URL_DOCUMENTS_MODE: ${{ inputs.provider_url_documents }}
          SUBS_BOT_PROVIDER_URL_DOCUMENTS_CONFIRMATION: ${{ inputs.provider_url_documents_confirmation }}
          SUBS_BOT_MIXED_DOCUMENTS_MODE: ${{ inputs.mixed_documents }}
          SUBS_BOT_MIXED_DOCUMENTS_CONFIRMATION: ${{ inputs.mixed_documents_confirmation }}
          SUBS_BOT_GROUP_SHARE_CARDS_MODE: ${{ inputs.group_share_cards }}
          SUBS_BOT_GROUP_SHARE_CARDS_CONFIRMATION: ${{ inputs.group_share_cards_confirmation }}
          SUBS_BOT_PROVIDER_REFRESH_MODE: ${{ inputs.provider_refresh }}
          SUBS_BOT_PROVIDER_REFRESH_CONFIRMATION: ${{ inputs.provider_refresh_confirmation }}
          SUBS_BOT_LEGACY_SUBSCRIPTION_SHORTS_MODE: ${{ inputs.legacy_subscription_shorts }}
          SUBS_BOT_LEGACY_SUBSCRIPTION_SHORTS_CONFIRMATION: ${{ inputs.legacy_subscription_shorts_confirmation }}
          SUBS_BOT_SUBSCRIPTION_SHORTS_MODE: ${{ inputs.subscription_shorts }}
          SUBS_BOT_SUBSCRIPTION_SHORTS_CONFIRMATION: ${{ inputs.subscription_shorts_confirmation }}
          SUBS_BOT_PROVIDER_BATCH_MODE: ${{ inputs.provider_batch }}
          SUBS_BOT_PROVIDER_BATCH_CONFIRMATION: ${{ inputs.provider_batch_confirmation }}
          SUBS_BOT_API_STATUS_MODE: ${{ inputs.api_status }}
          SUBS_BOT_API_STATUS_CONFIRMATION: ${{ inputs.api_status_confirmation }}
          SUBS_BOT_PAGE_JUMP_MODE: ${{ inputs.page_jump }}
          SUBS_BOT_PAGE_JUMP_CONFIRMATION: ${{ inputs.page_jump_confirmation }}
          SUBS_BOT_PAGE_JUMP_CHECKPOINT: ${{ inputs.page_jump_checkpoint }}
          SUBS_BOT_API_STATUS_CONTAINER_ATTESTATION: ${{ needs.attest-api-status.outputs.attestation }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_TELEGRAM_AGGREGATE_KEY: ${{ secrets.SUBS_BOT_TELEGRAM_AGGREGATE_KEY }}
          SUBS_BOT_TELEGRAM_PRIVATE_SHARE_CREATION_KEY: ${{ secrets.SUBS_BOT_TELEGRAM_PRIVATE_SHARE_CREATION_KEY }}
          SUBS_BOT_CF_PROVIDER_BINDING_JSON: ${{ secrets.SUBS_BOT_CF_PROVIDER_BINDING_JSON }}
          SUBS_BOT_CF_PROVIDER_API_STATUS_BINDING_JSON: ${{ secrets.SUBS_BOT_CF_PROVIDER_API_STATUS_BINDING_JSON }}
        run: python3 -B worker/tools/release_isolation.py
      - name: Activate closed or recover the exact isolated page-jump stage
        if: contains(fromJSON('["activate","reconcile","open","pause","pause-durable","drain","rollback"]'), inputs.page_jump)
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_INLINE_SEARCH_MODE: ${{ inputs.inline_search }}
          SUBS_BOT_INLINE_SEARCH_CONFIRMATION: ${{ inputs.inline_search_confirmation }}
          SUBS_BOT_PROVIDER_URL_IMPORT_MODE: ${{ inputs.provider_url_import }}
          SUBS_BOT_PROVIDER_URL_IMPORT_CONFIRMATION: ${{ inputs.provider_url_import_confirmation }}
          SUBS_BOT_PROVIDER_URL_DOCUMENTS_MODE: ${{ inputs.provider_url_documents }}
          SUBS_BOT_PROVIDER_URL_DOCUMENTS_CONFIRMATION: ${{ inputs.provider_url_documents_confirmation }}
          SUBS_BOT_MIXED_DOCUMENTS_MODE: ${{ inputs.mixed_documents }}
          SUBS_BOT_MIXED_DOCUMENTS_CONFIRMATION: ${{ inputs.mixed_documents_confirmation }}
          SUBS_BOT_GROUP_SHARE_CARDS_MODE: ${{ inputs.group_share_cards }}
          SUBS_BOT_GROUP_SHARE_CARDS_CONFIRMATION: ${{ inputs.group_share_cards_confirmation }}
          SUBS_BOT_PROVIDER_REFRESH_MODE: ${{ inputs.provider_refresh }}
          SUBS_BOT_PROVIDER_REFRESH_CONFIRMATION: ${{ inputs.provider_refresh_confirmation }}
          SUBS_BOT_LEGACY_SUBSCRIPTION_SHORTS_MODE: ${{ inputs.legacy_subscription_shorts }}
          SUBS_BOT_LEGACY_SUBSCRIPTION_SHORTS_CONFIRMATION: ${{ inputs.legacy_subscription_shorts_confirmation }}
          SUBS_BOT_SUBSCRIPTION_SHORTS_MODE: ${{ inputs.subscription_shorts }}
          SUBS_BOT_SUBSCRIPTION_SHORTS_CONFIRMATION: ${{ inputs.subscription_shorts_confirmation }}
          SUBS_BOT_PROVIDER_BATCH_MODE: ${{ inputs.provider_batch }}
          SUBS_BOT_PROVIDER_BATCH_CONFIRMATION: ${{ inputs.provider_batch_confirmation }}
          SUBS_BOT_API_STATUS_MODE: ${{ inputs.api_status }}
          SUBS_BOT_API_STATUS_CONFIRMATION: ${{ inputs.api_status_confirmation }}
          SUBS_BOT_PAGE_JUMP_MODE: ${{ inputs.page_jump }}
          SUBS_BOT_PAGE_JUMP_CONFIRMATION: ${{ inputs.page_jump_confirmation }}
          SUBS_BOT_PAGE_JUMP_CHECKPOINT: ${{ inputs.page_jump_checkpoint }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/release_isolation.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.page_jump != 'preserve'
        with:
          name: subs-bot-page-jump-${{ inputs.page_jump }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subs-bot-page-jump-evidence.json
          retention-days: 7
          if-no-files-found: error
