name: Deploy Worker isolation

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Worker CI run for this exact main commit
        required: true
        type: string
      inline_search:
        description: Preserve, enable, or disable inline search on the isolated Worker
        required: true
        default: preserve
        type: choice
        options:
          - preserve
          - enable
          - disable
      inline_search_confirmation:
        description: Exact isolation confirmation for enable or disable
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: subs-bot-isolation-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main'
    environment: subs-bot-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify merged artifact provenance and digests
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CI_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/prepare_isolation_artifact.py
      - name: Apply isolated D1 migrations and release verified Worker
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_INLINE_SEARCH_MODE: ${{ inputs.inline_search }}
          SUBS_BOT_INLINE_SEARCH_CONFIRMATION: ${{ inputs.inline_search_confirmation }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_TELEGRAM_AGGREGATE_KEY: ${{ secrets.SUBS_BOT_TELEGRAM_AGGREGATE_KEY }}
          SUBS_BOT_TELEGRAM_PRIVATE_SHARE_CREATION_KEY: ${{ secrets.SUBS_BOT_TELEGRAM_PRIVATE_SHARE_CREATION_KEY }}
          SUBS_BOT_CF_PROVIDER_BINDING_JSON: ${{ secrets.SUBS_BOT_CF_PROVIDER_BINDING_JSON }}
        run: python3 -B worker/tools/release_isolation.py
