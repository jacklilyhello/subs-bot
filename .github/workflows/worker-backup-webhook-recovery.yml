name: Inspect or restore the authorized isolated test webhook
run-name: Backup webhook ${{ inputs.action }} ${{ inputs.source_run_id }}-${{ inputs.source_attempt }}

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        required: true
        options: [diagnose, inspect, restore]
      source_run_id:
        description: Exact original reviewed-head dispatcher run
        type: string
        required: true
      source_attempt:
        description: Original attempt, must be one
        type: string
        required: true
        default: '1'
      source_main_sha:
        description: Exact main SHA of the original dispatcher run
        type: string
        required: true
      source_candidate_sha:
        description: Exact independently reviewed candidate SHA
        type: string
        required: true
      snapshot_sha256:
        description: Independently observed original webhook snapshot SHA256
        type: string
      freeze_confirmation_sha256:
        description: Independently observed successful trusted admission freeze digest
        type: string
      source_checkpoint_id:
        description: Exact privately archived active source checkpoint
        type: string
      source_manifest_sha256:
        description: Independently recorded active source manifest SHA256
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: subs-bot-lifecycle-rehearsal
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main' && vars.SUBS_BOT_BACKUP_WEBHOOK_RECOVERY_ENABLED == 'true'
    environment: subs-bot-backup-head-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Observe or restore once using trusted main
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_RECOVERY_ACTION: ${{ inputs.action }}
          WEBHOOK_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          WEBHOOK_SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          WEBHOOK_SOURCE_MAIN_SHA: ${{ inputs.source_main_sha }}
          WEBHOOK_SOURCE_CANDIDATE_SHA: ${{ inputs.source_candidate_sha }}
          WEBHOOK_REVIEWED_CANDIDATE_SHA: ${{ vars.SUBS_BOT_BACKUP_REVIEWED_HEAD_SHA }}
          WEBHOOK_SNAPSHOT_SHA256: ${{ inputs.snapshot_sha256 }}
          WEBHOOK_FREEZE_CONFIRMATION_SHA256: ${{ inputs.freeze_confirmation_sha256 }}
          WEBHOOK_SOURCE_CHECKPOINT_ID: ${{ inputs.source_checkpoint_id }}
          WEBHOOK_SOURCE_MANIFEST_SHA256: ${{ inputs.source_manifest_sha256 }}
          WEBHOOK_REGISTRATION_SHA256: ${{ vars.SUBS_BOT_REHEARSAL_REGISTRATION_SHA256 }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_SCOPED_R2_WRITE_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_WRITE_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_DATA_TOKEN }}
          SUBS_BOT_CF_REHEARSAL_WORKER_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_REHEARSAL_WORKER_READ_TOKEN }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          python3 -B worker/tools/production_backup_webhook_recovery.py
