name: Rehearse production lifecycle on registered isolation
run-name: Production lifecycle rehearsal ${{ github.event_name == 'schedule' && (github.event.schedule == '0 1 * * *' && 'daily-backup' || 'daily-backup-watchdog') || inputs.action }} at ${{ github.sha }}

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Exercise the production control implementation on the dedicated project rehearsal identity
        type: choice
        required: true
        default: inspect
        options: [bootstrap, exercise, inspect, stabilize, daily-backup, daily-backup-watchdog, backup-head-harness, backup-anchor-genesis-plan, backup-anchor-initialize, backup-anchor-initialize-reconcile-plan, backup-anchor-initialize-reconcile, backup-anchor-reconcile-plan, backup-anchor-reconcile, seed-fixture, recovery, recover-webhook, provider-binding, provider-binding-resume, provider-binding-reconcile]
      source_run_id:
        description: Successful exact-main Worker CI run
        type: string
        required: false
      registration_sha256:
        description: Exact private registration digest returned by bootstrap; required after initial bootstrap
        type: string
        required: false
      active_run_id:
        description: Explicit reviewed active Worker CI when inspecting or preserving an earlier deployment
        type: string
        required: false
      admin_message_id:
        description: Optional real authorized administrator message reply anchor read in the existing Telegram session
        type: string
        required: false
      member_message_id:
        description: Optional real authorized member message reply anchor read in the existing Telegram session
        type: string
        required: false
      human_window_seconds:
        description: IAB window; exercise up to 180s, provider-binding/resume requires explicit 60-540s within refresh-ticket TTL
        type: number
        default: 0
        required: false
      baseline_checkpoint_id:
        description: Optional explicit sealed G0 to reverify and reuse without a new capture
        type: string
        required: false
      baseline_manifest_sha256:
        description: Exact independent digest paired with the reused G0 checkpoint
        type: string
        required: false
      recovery_resume_json:
        description: Optional exact G0 checkpoint, manifest and latest journal SHA pins to resume owned recovery targets
        type: string
        required: false
      webhook_checkpoint:
        description: Interrupted exercise run-id/attempt for explicit webhook recovery
        type: string
        required: false
      webhook_snapshot_sha256:
        description: Exact private webhook snapshot digest from that interrupted exercise
        type: string
        required: false
      provider_run_id:
        description: Exact completed dedicated Provider archive run; required for provider-binding and its explicit resume
        type: string
        required: false
      provider_run_attempt:
        description: Exact independently archived Provider attempt
        type: string
        required: false
      provider_manifest_sha256:
        description: Independently read complete private Provider archive digest
        type: string
        required: false
      provider_ready_ack:
        description: Explicit IAB readiness for real refresh, copied from the documented dedicated-target phrase
        type: string
        required: false
      provider_binding_resume_json:
        description: Explicit interrupted run/attempt/intent SHA and independently confirmed active version/deployment; never re-uploads
        type: string
        required: false
      backup_warning_percent:
        description: Daily backup capacity warning percentage, 1-99
        type: string
        default: '80'
      backup_pause_limit_seconds:
        description: Alert if confirmed pause exceeds this duration, 60-900 seconds
        type: string
        default: '300'
      backup_source_checkpoint_id:
        description: Pinned private application checkpoint holding the exact active CI source
        type: string
      backup_source_manifest_sha256:
        description: Independent manifest SHA paired with backup_source_checkpoint_id
        type: string
      backup_fault:
        description: Isolated synthetic fault for a manually dispatched daily-backup rehearsal
        type: choice
        options: [none, capacity-near, capacity-over, readback-failure, process-kill]
        default: none
      backup_anchor_candidate_sha256:
        description: Exact immutable candidate digest for an interrupted anchor release
        type: string
      backup_anchor_approval_sha256:
        description: Independently reviewed genesis or reconciliation plan SHA-256
        type: string
      head_validation_json:
        description: Exact reviewed PR-head harness identity and action pins
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: subs-bot-lifecycle-rehearsal
  cancel-in-progress: false

jobs:
  head-validation:
    # Disabled until a trusted-main dispatcher or equivalent SHA-bound secret
    # boundary is installed and the exact head is independently reviewed.
    if: false && github.repository == 'jacklilyhello/subs-bot' && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/codex/') && inputs.action == 'backup-head-harness'
    environment: subs-bot-backup-head-isolation
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'
      - name: Verify exact reviewed head and dedicated frozen source
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CONTROL_ENVIRONMENT: subs-bot-isolation
          HEAD_VALIDATION_JSON: ${{ inputs.head_validation_json }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          python3 -B worker/tools/production_backup_head_harness.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: subs-bot-backup-head-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-backup-head-result.json
          if-no-files-found: warn
          retention-days: 7
  rehearse:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main'
    environment: subs-bot-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUBS_BOT_CI_RUN_ID: ${{ inputs.source_run_id }}
      SUBS_BOT_CONTROL_ENVIRONMENT: subs-bot-isolation
      DRILL_ACTION: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 1 * * *' && 'daily-backup' || 'daily-backup-watchdog') || inputs.action }}
      DRILL_REGISTRATION_SHA256: ${{ inputs.registration_sha256 || vars.SUBS_BOT_REHEARSAL_REGISTRATION_SHA256 }}
      DRILL_ACTIVE_CI_RUN_ID: ${{ inputs.active_run_id || vars.SUBS_BOT_REHEARSAL_ACTIVE_CI_RUN_ID }}
      DRILL_ADMIN_MESSAGE_ID: ${{ inputs.admin_message_id }}
      DRILL_MEMBER_MESSAGE_ID: ${{ inputs.member_message_id }}
      DRILL_HUMAN_WINDOW_SECONDS: ${{ inputs.human_window_seconds }}
      DRILL_BASELINE_CHECKPOINT_ID: ${{ inputs.baseline_checkpoint_id }}
      DRILL_BASELINE_MANIFEST_SHA256: ${{ inputs.baseline_manifest_sha256 }}
      DRILL_RECOVERY_RESUME_JSON: ${{ inputs.recovery_resume_json }}
      DRILL_WEBHOOK_CHECKPOINT: ${{ inputs.webhook_checkpoint }}
      DRILL_WEBHOOK_SNAPSHOT_SHA256: ${{ inputs.webhook_snapshot_sha256 }}
      DRILL_PROVIDER_RUN_ID: ${{ inputs.provider_run_id }}
      DRILL_PROVIDER_RUN_ATTEMPT: ${{ inputs.provider_run_attempt }}
      DRILL_PROVIDER_MANIFEST_SHA256: ${{ inputs.provider_manifest_sha256 }}
      DRILL_PROVIDER_READY_ACK: ${{ inputs.provider_ready_ack }}
      DRILL_PROVIDER_BINDING_RESUME_JSON: ${{ inputs.provider_binding_resume_json }}
      DRILL_BACKUP_WARNING_PERCENT: ${{ inputs.backup_warning_percent || vars.SUBS_BOT_REHEARSAL_BACKUP_WARNING_PERCENT || '80' }}
      DRILL_BACKUP_PAUSE_LIMIT_SECONDS: ${{ inputs.backup_pause_limit_seconds || vars.SUBS_BOT_REHEARSAL_BACKUP_PAUSE_SECONDS || '300' }}
      DRILL_BACKUP_SOURCE_CHECKPOINT_ID: ${{ inputs.backup_source_checkpoint_id || vars.SUBS_BOT_REHEARSAL_BACKUP_SOURCE_CHECKPOINT_ID }}
      DRILL_BACKUP_SOURCE_MANIFEST_SHA256: ${{ inputs.backup_source_manifest_sha256 || vars.SUBS_BOT_REHEARSAL_BACKUP_SOURCE_MANIFEST_SHA256 }}
      DRILL_BACKUP_GENESIS_SHA256: ${{ vars.SUBS_BOT_REHEARSAL_BACKUP_GENESIS_SHA256 }}
      DRILL_BACKUP_WRITES_ENABLED: ${{ vars.SUBS_BOT_REHEARSAL_BACKUP_WRITES_ENABLED }}
      DRILL_BACKUP_WATCHDOG_ENABLED: ${{ vars.SUBS_BOT_REHEARSAL_BACKUP_WATCHDOG_ENABLED }}
      DRILL_BACKUP_ANCHOR_CANDIDATE_SHA256: ${{ inputs.backup_anchor_candidate_sha256 }}
      DRILL_BACKUP_ANCHOR_APPROVAL_SHA256: ${{ inputs.backup_anchor_approval_sha256 }}
      DRILL_BACKUP_FAULT: ${{ github.event_name == 'schedule' && 'none' || inputs.backup_fault || 'none' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.action == 'recovery'
        with:
          node-version: '24'
      - name: Install locked hosted replay dependencies before private inputs
        if: inputs.action == 'recovery'
        working-directory: worker
        run: npm ci --ignore-scripts
      - name: Execute the registered production lifecycle code path
        if: github.event_name != 'schedule' || (github.event.schedule == '0 1 * * *' && vars.SUBS_BOT_REHEARSAL_DAILY_BACKUP_ENABLED == 'true') || (github.event.schedule != '0 1 * * *' && vars.SUBS_BOT_REHEARSAL_BACKUP_WATCHDOG_ENABLED == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
          SUBS_BOT_CF_DEPENDENCY_READ_TOKEN: ${{ (inputs.action == 'provider-binding' || inputs.action == 'provider-binding-resume' || inputs.action == 'provider-binding-reconcile') && secrets.SUBS_BOT_CF_DEPENDENCY_READ_TOKEN || '' }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          python3 -B worker/tools/production_lifecycle_drill.py
      - name: Independently restore the original test webhook after the exercise
        if: always() && (inputs.action == 'exercise' || inputs.action == 'provider-binding' || inputs.action == 'provider-binding-resume')
        env:
          DRILL_ACTION: recover-webhook
          DRILL_AUTOMATIC_CLEANUP: '1'
          DRILL_REPORT_NAME: production-lifecycle-drill-cleanup.json
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
        run: |
          umask 077
          python3 -B worker/tools/production_lifecycle_drill.py
      - name: Independently replay G0 and recovered target without outbound access
        if: inputs.action == 'recovery'
        working-directory: worker
        run: |
          module="$RUNNER_TEMP/production-recovery-drill-module"
          sandbox="$(mktemp -d)"
          trap 'rm -rf -- "$sandbox" "$module" "$RUNNER_TEMP/production-recovery-drill-g0-links" "$RUNNER_TEMP/production-recovery-drill-recovered-links"' EXIT
          for kind in g0 recovered; do
            validation="$RUNNER_TEMP/production-recovery-drill-$kind-links"
            result="$RUNNER_TEMP/production-recovery-drill-$kind-http.json"
            sudo -n unshare --net -- bash -euc '
              ip link set dev lo up
              umask 077
              ulimit -c 0
              exec setpriv --reuid="$1" --regid="$2" --clear-groups --no-new-privs -- \
                env -i PATH=/usr/bin:/bin HOME="$3" TMPDIR="$3" \
                "$4" tools/production-restored-links.ts "$5" "$6" "$7"
            ' -- "$(id -u)" "$(id -g)" "$sandbox" "$(command -v node)" "$validation" "$module" "$result"
          done
      - name: Finalize only both complete positive and revoked-link HTTP results
        if: inputs.action == 'recovery'
        env:
          DRILL_ACTION: finalize-recovery
          DRILL_REPORT_NAME: production-lifecycle-drill-final.json
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_TELEGRAM_TEST_CONFIG: ${{ secrets.SUBS_BOT_TELEGRAM_TEST_CONFIG }}
          SUBS_BOT_CONTROL_DRILL_KEYS: ${{ secrets.SUBS_BOT_CONTROL_DRILL_KEYS }}
        run: |
          umask 077
          python3 -B worker/tools/production_lifecycle_drill.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: subs-bot-lifecycle-rehearsal-${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-lifecycle-drill-result.json
            ${{ runner.temp }}/production-lifecycle-drill-cleanup.json
            ${{ runner.temp }}/production-lifecycle-drill-final.json
            ${{ runner.temp }}/production-recovery-drill-g0-http.json
            ${{ runner.temp }}/production-recovery-drill-recovered-http.json
            ${{ runner.temp }}/production-lifecycle-recovery-g0-http-result.json
            ${{ runner.temp }}/production-lifecycle-recovery-recovered-http-result.json
          if-no-files-found: warn
          retention-days: 7
