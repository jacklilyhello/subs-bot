name: Rehearse isolated native D1 and R2 restore

on:
  workflow_dispatch:
    inputs:
      action:
        description: One protected rehearsal checkpoint
        required: true
        default: verify
        type: choice
        options:
          - verify
          - prepare
          - create-backup-bucket
          - create-restore-db
          - create-restore-bucket
          - pin-resource
          - capture
          - poll-export
          - restore-objects
          - start-import
          - verify-restore
      cohort:
        description: Unique 32-character lowercase hexadecimal rehearsal identifier
        required: true
        type: string
      source_run_id:
        description: Successful Worker CI run for this exact main commit
        required: true
        type: string
      resource:
        description: Resource to reconcile after an unacknowledged create (pin-resource only)
        default: backup
        type: choice
        options: [backup, database, objects]
      identity_sha256:
        description: Independently confirmed candidate identity digest (pin-resource only)
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: subs-bot-isolation-deploy
  cancel-in-progress: false

jobs:
  rehearse:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main'
    environment: subs-bot-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Verify merged artifact provenance and digests
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CI_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/prepare_isolation_artifact.py
      - name: Run the selected isolation rehearsal checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_BOOTSTRAP_TOKEN }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_CF_DEPLOY_TOKEN }}
        run: python3 -B worker/tools/native_restore_rehearsal.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subs-bot-native-restore-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-restore-evidence.json
          if-no-files-found: error
          retention-days: 7
