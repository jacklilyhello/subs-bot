name: Rehearse isolated native D1 and R2 restore

on:
  workflow_dispatch:
    inputs:
      action:
        description: One protected rehearsal checkpoint
        required: true
        default: verify
        type: choice
        options:
          - verify
          - prepare
          - create-backup-bucket
          - create-restore-db
          - create-restore-bucket
          - pin-resource
          - capture
          - poll-export
          - restore-objects
          - start-import
          - verify-restore
      cohort:
        description: Unique 32-character lowercase hexadecimal rehearsal identifier
        required: true
        type: string
      source_run_id:
        description: Successful main Worker CI of the exact immutable deployed source, which may predate the current control tool
        required: true
        type: string
      source_run_attempt:
        description: Exact successful source CI attempt; keep fixed for an existing rehearsal
        required: true
        default: '1'
        type: string
      source_archive_run_id:
        description: Optional private evidence archive holding the exact source CI, independent of Actions artifact expiry
        type: string
      source_archive_run_attempt:
        description: Exact private evidence archive attempt; requires archive run and manifest digest
        default: '1'
        type: string
      source_archive_manifest_sha256:
        description: Independent private archive manifest SHA-256; must accompany archive run
        type: string
      resource:
        description: Resource to reconcile after an unacknowledged create (pin-resource only)
        default: backup
        type: choice
        options: [backup, database, objects]
      identity_sha256:
        description: Independently confirmed candidate identity digest (pin-resource only)
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: subs-bot-isolation-deploy
  cancel-in-progress: false

jobs:
  rehearse:
    if: github.repository == 'jacklilyhello/subs-bot' && github.ref == 'refs/heads/main'
    environment: subs-bot-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.action == 'verify-restore'
        with:
          node-version: '24'
      - name: Install locked hosted validation dependencies before reading private data
        if: inputs.action == 'verify-restore'
        working-directory: worker
        run: npm ci --ignore-scripts
      - name: Verify current control tool and immutable native source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CI_RUN_ID: ${{ inputs.source_run_id }}
          SUBS_BOT_CI_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          NATIVE_SOURCE_ARCHIVE_RUN_ID: ${{ inputs.source_archive_run_id }}
          NATIVE_SOURCE_ARCHIVE_RUN_ATTEMPT: ${{ inputs.source_archive_run_attempt }}
          NATIVE_SOURCE_ARCHIVE_MANIFEST_SHA256: ${{ inputs.source_archive_manifest_sha256 }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_SCOPED_R2_EXTRA_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_EXTRA_READ_JSON }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B worker/tools/prepare_native_restore_artifact.py
      - name: Run the selected isolation rehearsal checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          SUBS_BOT_CF_ISOLATION_TARGET_JSON: ${{ secrets.SUBS_BOT_CF_ISOLATION_TARGET_JSON }}
          SUBS_BOT_CF_BOOTSTRAP_TOKEN: ${{ contains(fromJSON('["capture","poll-export","create-restore-db","start-import"]'), inputs.action) && secrets.SUBS_BOT_CF_ISOLATION_DATA_TOKEN || !contains(fromJSON('["capture","poll-export","create-restore-db","start-import"]'), inputs.action) && secrets.SUBS_BOT_CF_ISOLATION_DATA_READ_TOKEN || '' }}
          SUBS_BOT_CF_DEPLOY_TOKEN: ${{ secrets.SUBS_BOT_SEALED_WORKER_READ_TOKEN }}
          SUBS_BOT_CF_R2_METADATA_READ_TOKEN: ${{ secrets.SUBS_BOT_CF_R2_METADATA_READ_TOKEN }}
          SUBS_BOT_CF_R2_CREATE_TOKEN: ${{ contains(fromJSON('["create-backup-bucket","create-restore-bucket"]'), inputs.action) && secrets.SUBS_BOT_CF_R2_CREATE_TOKEN || '' }}
          SUBS_BOT_SCOPED_R2_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_READ_JSON }}
          SUBS_BOT_SCOPED_R2_EXTRA_READ_JSON: ${{ secrets.SUBS_BOT_SCOPED_R2_EXTRA_READ_JSON }}
          SUBS_BOT_SCOPED_R2_WRITE_JSON: ${{ inputs.action != 'verify' && secrets.SUBS_BOT_SCOPED_R2_WRITE_JSON || '' }}
          SUBS_BOT_SCOPED_R2_EXTRA_WRITE_JSON: ${{ inputs.action != 'verify' && secrets.SUBS_BOT_SCOPED_R2_EXTRA_WRITE_JSON || '' }}
          SUBS_BOT_TELEGRAM_AGGREGATE_KEY: ${{ inputs.action == 'verify-restore' && secrets.SUBS_BOT_TELEGRAM_AGGREGATE_KEY || '' }}
        run: python3 -B worker/tools/native_restore_rehearsal.py
      - name: Verify restored native links with exact bundle and no outbound interface
        if: inputs.action == 'verify-restore'
        working-directory: worker
        run: |
          validation="$RUNNER_TEMP/native-restore-links"
          sandbox="$(mktemp -d)"
          trap 'rm -rf -- "$validation" "$sandbox"' EXIT
          sudo -n unshare --net -- bash -euc '
            ip link set dev lo up
            umask 077
            ulimit -c 0
            exec setpriv --reuid="$1" --regid="$2" --clear-groups --no-new-privs -- \
              env -i PATH=/usr/bin:/bin HOME="$3" TMPDIR="$3" \
              "$4" tools/native-restored-links.ts "$5" "$6" "$7"
          ' -- "$(id -u)" "$(id -g)" "$sandbox" "$(command -v node)" "$validation" \
            "$RUNNER_TEMP/subs-bot-verified" "$RUNNER_TEMP/native-restored-links-evidence.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: subs-bot-native-restore-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-restore-evidence.json
            ${{ runner.temp }}/native-restored-links-evidence.json
          if-no-files-found: error
          retention-days: 7
